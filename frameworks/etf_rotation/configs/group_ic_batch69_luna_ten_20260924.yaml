mechanisms:
  l69_post_long_break_relative_return:
    direction: 1
    raw_formula: For each session t with calendar date gap date_t−date_{t−1}≥3 days,
      e_i,t=r_i,t−mean_{j≠i}(r_j,t); factor=mean(e_i,t over qualifying dates among
      the 20 consecutive trading sessions ending at D); NaN if none.
    hypothesis: Price discovery following an extended nontrading interval may continue
      into the close.
    family: post_long_break_price_discovery
    nearest_previous: month_end_calendar_relative_return_120; gap repair measures.
      This is post-long-break close-to-close relative return, not a month-end calendar
      window or all-day gap-repair statistic.
    distinction: Break length is calendar-date gap ≥3, covering weekends and exchange
      holidays; formula uses only information available at close D. Each factor uses
      a fixed contiguous 20-row trailing window; missing required inputs invalidate
      that window rather than compressing dates.
  l69_post_long_break_gap_excess:
    direction: 1
    raw_formula: On the same qualifying t, g_i,t=open_i,t/close_i,t−1−1; factor=mean(g_i,t−mean_{j≠i}(g_j,t))
      over qualifying dates among latest 20 sessions; NaN if none.
    hypothesis: Peer-relative overnight repricing after a longer information gap marks
      delayed market assimilation.
    family: post_long_break_price_discovery
    nearest_previous: overnight_intraday_beta_gap_60; gap repair measures.
    distinction: Calendar-conditioned peer-relative open gap level; no response slope
      or intraday gap-fill fraction. Each factor uses a fixed contiguous 20-row trailing
      window; missing required inputs invalidate that window rather than compressing
      dates.
  l69_post_long_break_body_excess:
    direction: 1
    raw_formula: On the same qualifying t, b_i,t=close_i,t/open_i,t−1; factor=mean(b_i,t−mean_{j≠i}(b_j,t))
      over qualifying dates among latest 20 sessions; NaN if none.
    hypothesis: Intraday follow-through after a long break distinguishes durable repricing
      from an opening-only response.
    family: post_long_break_price_discovery
    nearest_previous: gap repair / l49 peer-gap-to-member-body beta.
    distinction: Calendar-conditioned same-session peer-relative body, not a rolling
      peer-gap response coefficient. Each factor uses a fixed contiguous 20-row trailing
      window; missing required inputs invalidate that window rather than compressing
      dates.
