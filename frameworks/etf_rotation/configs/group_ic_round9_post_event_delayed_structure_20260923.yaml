mechanisms:
  post_market_tail_delayed_relative_return:
    direction: 1
    window: 60
    hypothesis: "MY_ASSUMPTION. Master's round 9/10 angle (no formula given): the TIME STRUCTURE of relative returns after an event, specifically days t+2..t+5, distinct from round 7's post_market_tail_relative_return/post_own_tail_relative_return which only tested day t+1 (both NOT_SUPPORTED_THIS_SCREEN). Same market-tail-day threshold construction as round 7 (top quintile trailing |r_m| over the window), but the conditioning mask is now the OR of shift(2..5) instead of shift(1) -- day+1 captures the fast/algorithmic reaction (already tested, not found); ETF capital reallocation (thinner liquidity/attention than index futures) is hypothesized to take several days to fully manifest, a genuinely different timing claim, not a re-run of the day+1 test. direction +1 (continuation/resilience, same narrative as round 7's day+1 version, unchanged)."
    raw_formula: "market_tail_day = |r_m| >= trailing-60d top-quintile(|r_m|); delayed_window = OR(market_tail_day.shift(2), .shift(3), .shift(4), .shift(5)); mean(r_i - r_m | delayed_window, w=60, min_periods=3)."
  post_own_tail_delayed_relative_return:
    direction: -1
    window: 60
    hypothesis: "MY_ASSUMPTION. Same days-t+2..t+5 delayed window as above, but conditioned on the MEMBER'S OWN idiosyncratic tail day (top quintile trailing |residual|, same construction as round 7's post_own_tail_relative_return) instead of a market-wide event -- the conditioning-variable distinction the campaign has already treated as legitimately separate (market event vs member's own idiosyncratic event, e.g. beta_asymmetry-family candidates). Mechanism distinct from candidate 1: an idiosyncratic single-name residual shock is more likely a transient premium/discount dislocation (liquidity-driven overshoot, temporary creation/redemption imbalance) that the ETF arbitrage mechanism corrects over the following days, unlike a market-wide move which reflects genuine repricing that a single ETF cannot arbitrage away. direction -1 (reversal, opposite of candidate 1's continuation)."
    raw_formula: "own_tail_day = |r_i - r_m| >= trailing-60d top-quintile(|r_i - r_m|); delayed_window = OR(own_tail_day.shift(2..5)); mean(r_i - r_m | delayed_window, w=60, min_periods=3) * -1."
  post_dispersion_delayed_relative_return:
    direction: -1
    window: 60
    hypothesis: "MY_ASSUMPTION. Same days-t+2..t+5 delayed window, but conditioned on a HIGH 8-GROUP CROSS-SECTIONAL DISPERSION day (reuses _group_dispersion, the same USER dispersion-framework measure round 6 used for dispersion_conditional_relative_return/_beta_gap; top quintile here for consistency with this round's own other two candidates, vs round 6's tercile for its own SAME-day version). Conditioning event here is cross-sectional DIFFERENTIATION across the 8 economic groups (a rotation/regime-split event), not a single benchmark return's own magnitude -- a third, genuinely distinct event type from candidates 1/2. High-dispersion days often reflect temporary, flow-driven differentiation (thematic rotation overreaction, concentrated creation/redemption in a subset of groups) rather than fully efficient repricing; as dispersion normalizes over the following days, the pool's average relative-return level in this delayed post-dispersion regime should compress back toward the market mean. direction -1 (reversion) -- note this is the OPPOSITE narrative and OPPOSITE direction from round 6's SAME-day dispersion_conditional_relative_return (direction +1, continuation), which was dropped at the dedup precheck stage (0.7389 vs vol_scaled_momentum_60) before ever being IC-tested; this candidate is not a resubmission of that one, it targets a different lag structure with an opposite hypothesis."
    raw_formula: "dispersion = std across the 8 economic groups' own equal-weight daily returns (all 8 valid); high_disp_day = dispersion >= trailing-60d top-quintile(dispersion); delayed_window = OR(high_disp_day.shift(2..5)); mean(r_i - r_m | delayed_window, w=60, min_periods=3) * -1."
