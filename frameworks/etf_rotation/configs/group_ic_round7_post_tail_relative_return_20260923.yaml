  dropped_candidates_and_observation: >-
    roll_spread_60 (Roll 1984 bid-ask spread estimator, direction -1): no-label dedup clean (max 0.4840), but
    STRUCTURALLY INVALID -- 2 of 6 single-member groups (hk_technology mode_value_rate=0.5810, metals_equity
    mode_value_rate=0.5024) have >50% identical values, because Roll's estimator clips to exactly 0 whenever
    the rolling covariance is non-negative (no detectable bid-ask bounce), which happens on more than half the
    days for these two relatively liquid, lower-microstructure-noise names -- an inherent property of the
    estimator, not a code defect. gap_fill_completion_relative_market_60 (MY_ASSUMPTION, own gap-fill-
    completion rate minus the market's own rate, direction -1): dedup-dropped, 0.7742 vs the already-tested
    daily_rounds:gap_repair_completion_rate_20 (an absolute own-name level with no market benchmark) and 0.7556
    vs its d2025 variant, plus 0.7004 vs ohlc_range_overlap_20 -- unlike round 4's overnight_intraday_sign_
    consistency_relative_market, the "subtract the market's own rate" framing did not create enough
    differentiation from the pre-existing absolute-level family this time. beta_to_leader_group_20 (master's
    own formula, rotation-leader co-movement, direction +1): dedup-dropped, 0.7335 vs market_residual_market_
    beta_20 and 0.7266 vs its d2025 variant -- "beta to whichever economic group is currently leading" appears
    to correlate heavily with plain unconditional market beta, since the leader group's returns still carry a
    large common-market component; structurally clean (420/420 group coverage) but not information-additive
