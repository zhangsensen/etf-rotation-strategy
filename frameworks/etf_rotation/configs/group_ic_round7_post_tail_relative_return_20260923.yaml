mechanisms:
  post_market_tail_relative_return:
    direction: 1
    window: 60
    hypothesis: "MY_ASSUMPTION: mean(r_i - r_m) on the day immediately AFTER a market-wide tail event (the market itself was in its own trailing-window top-20%-by-|return| the PRIOR day), within the trailing 60-day window. Mechanism: shock absorption / recovery the day after a common market shock is read as resilience, the same 'confirmation/resilience predicts continuation' narrative already used for market_tail_relative_return and volume_surge_relative_return, but shifted to the day AFTER the event (neither of those prior, dedup-dropped candidates looked at next-day dynamics). direction +1."
    raw_formula: "market_tail_day(t) = |r_m(t)| >= rolling_quantile(|r_m|, 0.80, w=60) (causal); post_tail_day(t) = market_tail_day(t-1) (fully causal, no leakage: yesterday's classification only used data through yesterday); mean(r_i-r_m | post_tail_day, w=60, min_periods=3)."
  post_own_tail_relative_return:
    direction: 1
    window: 60
    hypothesis: "MY_ASSUMPTION: same 'day after an extreme, resilience predicts continuation' mechanism as post_market_tail_relative_return, but conditioned on the MEMBER'S OWN extreme residual day instead of the market's -- a different conditioning variable, the same distinction the campaign has already treated as legitimately separate candidates (beta_asymmetry vs high_low_vol_beta_gap vs quantile_beta_gap vs dispersion_conditional_beta_gap, all conditional-beta-gap on different regime variables). direction +1."
    raw_formula: "own_tail_day(t) = |residual(t)| >= rolling_quantile(|residual|, 0.80, w=60) (causal, residual=r_i-r_m); post_own_tail_day(t) = own_tail_day(t-1); mean(residual | post_own_tail_day, w=60, min_periods=3)."
