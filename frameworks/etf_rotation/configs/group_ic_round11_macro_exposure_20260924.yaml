  macro_lag_rule: >-
    Master's rule (2026-09-24): foreign-market variables (US 10y real/nominal yield, USDCNH) observed on
    calendar date t may only be used starting A-share trading date t+1; domestic futures (copper CU, 10y bond
    future T) settle same-day and are usable the same A-share date. Implemented in
    etf_group_claude_rounds.py's _align_macro_series as a two-stage transform: (1) forward-fill each macro
    variable's own native-date series onto the A-share trading calendar (same-day-inclusive); (2) for FOREIGN
    variables only, an additional one-A-share-SESSION .shift(1) on the now A-share-indexed stage-1 result (not
    a fixed calendar-day count, and not applied on the native date axis). This is DELIBERATELY CONSERVATIVE
    (never a leak, only ever more lag than the strict minimum) for a foreign print whose native date falls on
    a day the A-share calendar has no session for (e.g. a weekend USDCNH print, since FX trades weekends and
    A-share does not): such a print only takes effect from the A-share session AFTER the one that first
    forward-fills it in, i.e. potentially two A-share sessions after the weekend print's own date rather than
    the bare minimum "next calendar day" a literal reading of the rule might suggest for that edge case.
    Domestic futures (copper, bond future) have no A-share-absent native trading days, so this edge case does
    not apply to them. Verified via a dedicated unit test with a controlled step-change fixture
    (test_macro_foreign_next_day_domestic_same_day_lag_boundary) and an independent second implementation
    using pd.merge_asof matching the two-stage semantics exactly (test_macro_changes_alignment_independent_
    merge_asof) -- the first version of that independent test collapsed the two stages into a single
    strict-inequality query and disagreed with the real implementation on ~40% of rows before being corrected
    to the actual two-stage form, a genuine discrepancy caught and resolved before this proposal, not glossed
    over.
  shared_script_change: >-
    frameworks/etf_rotation/scripts/research/discover_etf_groups.py gained an opt-in `macro_inputs: true` flag
    (mirroring round 5's `minute_inputs` precedent exactly): loads the 5 macro parquet files (hashed into the
    PLAN's input_hashes separately from the canonical-root-checked `files` list, since they live under
    runtime_outputs/ not the canonical price data root), calls the new module-level load_macro_panel, and
