mechanisms:
  real_rate_beta:
    direction: -1
    window: 60
    hypothesis: "Master's own formula. 60-day beta of each member's own return on the daily CHANGE in the US 10y real (TIPS) yield (us_trycr.y10), foreign-next-day-lagged (see notes.macro_lag_rule). direction -1: more negatively sensitive to real rates predicts relative strength (a rate-sensitivity premium narrative -- master's own words, cross-checked before implementation rather than accepted uncritically per the campaign's standing practice)."
    raw_formula: "real_rate_change = diff(align(us_trycr.y10, foreign_lag=True)); beta(r_i, real_rate_change, w=60)."
  usd_beta:
    direction: -1
    window: 60
    hypothesis: "Master's own formula. 60-day beta of each member's own return on USDCNH's own daily return (USDCNH.bid_close), foreign-next-day-lagged. direction -1."
    raw_formula: "usdcnh_return = pct_change(align(USDCNH.bid_close, foreign_lag=True)); beta(r_i, usdcnh_return, w=60)."
  macro_r2:
    direction: -1
    window: 60
    hypothesis: "Master's own formula. 60-day R\xB2 of each member's own return regressed on all 5 macro changes jointly (real rate, nominal rate, USDCNH, copper, bond future). direction -1: low macro explanatory power = the member's return is idiosyncratically (not macro-)driven."
    raw_formula: "R\xB2 of a rolling 60-day multivariate OLS (with intercept, via centered X/y) of r_i on the 5 macro changes jointly (real_rate_change, nominal_rate_change, usdcnh_return, copper_return, bond_future_return)."
  macro_expected_return_60_20:
    direction: 1
    window: 60
    hypothesis: "Master's own formula, two legs: a 60-day rolling multivariate OLS beta (each member's own return on the 5 macro changes jointly) times the SAME 5 macro variables' own 20-day cumulative change, summed across the 5 regressors -- macro-driven expected return continues. direction +1."
    raw_formula: "sum_k( beta_k(60d multivariate OLS of r_i on 5 macro changes) * cum_change_20d(macro_change_k) ), k over the 5 macro regressors."
