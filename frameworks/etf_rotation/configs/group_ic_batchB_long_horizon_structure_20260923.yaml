mechanisms:
  momentum_120_skip5:
    direction: 1
    window: 120
    hypothesis: "close[t-5]/close[t-120]-1: 12-1-month-style momentum with the most recent 5 trading days skipped to avoid short-term reversal contamination. Direction +1: continued relative strength."
    raw_formula: "close.shift(5) / close.shift(120) - 1"
  momentum_250_skip20:
    direction: 1
    window: 250
    hypothesis: "close[t-20]/close[t-250]-1: a longer-horizon skip-recency momentum (roughly one year lookback, one month skipped). Direction +1."
    raw_formula: "close.shift(20) / close.shift(250) - 1"
  vol_scaled_momentum:
    direction: 1
    window: 60
    hypothesis: "60-day return scaled by the 60-day daily-return standard deviation (a risk-adjusted momentum). Direction +1: risk-adjusted strength persists better than raw return."
    raw_formula: "close.pct_change(60) / rolling_std(daily_return, 60)"
  tsmom_consistency:
    direction: 1
    window: 120
    hypothesis: "Fraction of the six trailing non-overlapping 20-day blocks (sampled backward from today: today, today-20d, ..., today-100d) with a positive 20-day return. Direction +1: more consistent time-series momentum persists better than a single-period return of the same magnitude."
    raw_formula: >-
      block_return = close.pct_change(20); positive = block_return>0 (NaN-preserving, not gt(0)'s silent-False on
      NaN); mean of positive sampled at window-relative offsets [-1,-21,-41,-61,-81,-101] (i.e. today and every
      20th prior day, 6 points), each offset itself a genuine pct_change(20) endpoint with no missing history in
      the offset chain; requires all 6 finite.
  vol_of_vol:
    direction: -1
    window: 60
    hypothesis: "Standard deviation of the rolling-20-day realized volatility over the trailing 60 days, scaled by its own 60-day mean level. Direction -1: an unstable (high vol-of-vol) risk regime predicts relative weakness."
    raw_formula: "rolling_std(rolling_std(daily_return,20), 60) / rolling_mean(rolling_std(daily_return,20), 60)"
  illiquidity_trend:
    direction: -1
    window: 60
    hypothesis: "Amihud(20)/Amihud(60) - 1, i.e. the CHANGE in price impact per unit turnover, not its level (the existing registered 'illiquidity' family is a level, INCOMPLETE_EVIDENCE status; this is its trend). Direction -1: a rising (deteriorating) illiquidity trend predicts relative weakness."
    raw_formula: "amihud20 = mean(abs(daily_return)/amount, 20); amihud60 = mean(abs(daily_return)/amount, 60); amihud20/amihud60 - 1"
