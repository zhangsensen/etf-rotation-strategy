# Direction was selected on the 2025 outcome microscope. It is not a
# mechanism prior and is not an independent confirmation surface.
mechanisms:
  VAR_RATIO_5_60:
    direction: 1
    mechanism: directional_return_memory
    formula: Var_60(rolling_sum_5(return)) / (5 * Var_60(return))
  RETURN_AUTOCOV_20:
    direction: 1
    mechanism: return_serial_dependence
    formula: Cov_20(return_t, return_t_minus_1)
  DOWN_UP_ACTIVITY_20:
    direction: -1
    mechanism: downside_to_upside_activity_pressure
    formula: mean(amount_on_down_days_20) / mean(amount_on_up_days_20)
  SHOCK_ACTIVITY_RESPONSE_20:
    direction: -1
    mechanism: lagged_shock_activity_response
    formula: Corr_20(delta_log_amount, abs_lagged_return)
  RANGE_ACTIVITY_ELASTICITY_20:
    direction: 1
    mechanism: uncertainty_activity_coupling
    formula: Corr_20(delta_log_amount, delta_daily_range_pct)
  VOL_RESPONSE_ASYMMETRY_20:
    direction: -1
    mechanism: downside_range_response_asymmetry
    formula: mean(range_pct_after_down_return_20) / mean(range_pct_after_up_return_20)
  RETURN_CONCENTRATION_20:
    direction: 1
    mechanism: concentrated_repricing
    formula: sum(return_squared_20) / sum(abs_return_20)^2
  OVERHEAD_TURNOVER_20:
    direction: -1
    mechanism: traded_price_overhead_supply
    formula: sum(amount_where_typical_price_above_current_close_20) / sum(amount_20)

