mechanisms:
  corr_horizon_ratio:
    direction: -1
    window: 60
    hypothesis: "corr(5-day overlapping r_i, r_m) / corr(1-day r_i, r_m), both over the trailing 60-day window (dense). Master's own spec: a ratio below 1 (high-frequency correlation lower than low-frequency correlation) is an Epps-effect-style signature of lagged/staggered co-movement -- a different object from lead_lag statistics (those measure LEAD-LAG DIRECTION at a fixed lag; this measures the AGGREGATION-HORIZON level at which co-movement becomes visible, direction-agnostic). direction -1."
    raw_formula: "returns_5d = close.pct_change(5); market_5d = fixed14 equal-weight mean of returns_5d on all-14-valid days (same convention as the 1-day market leg); corr_1d = corr(market_1d, returns_1d, w=60); corr_5d = corr(market_5d, returns_5d, w=60); corr_5d / corr_1d (zero-guarded)."
  residual_semideviation_asymmetry:
    direction: 1
    window: 60
    hypothesis: "MY_ASSUMPTION: market-residual return volatility asymmetry between the residual's own up-days and down-days (upside semi-deviation minus downside semi-deviation), read the same way as residual_skew_gap's up/down asymmetry but a different moment (2nd, not 3rd) of the same up/down-day conditional split. The campaign has already accepted variance-ratio/kurtosis/skew-gap as distinct moment-family candidates on the same residual series, not merged a priori. direction +1: more upside vol relative to downside vol is a favorable asymmetry."
    raw_formula: "residual=r_i-r_m; up_vol=std(residual|residual>0, w=60, conditional min_periods=15); down_vol=std(residual|residual<0, w=60, conditional min_periods=15); up_vol - down_vol."
  weekday_relative_return_pattern:
    direction: 1
    window: 60
    hypothesis: "MY_ASSUMPTION: a day-of-week seasonality pattern in relative returns (the classic 'weekend effect' literature: Monday relative weakness, Friday relative strength) persisting is read the same 'seasonality persistence' way as master's own month_end_calendar_relative_return -- but a date's weekday name is an intrinsic, immediately-known property of the date itself (no forward information about whether more trading days remain in any period is ever needed), so this candidate has no leakage analog of the original month-end trading-day-count issue. direction +1: mean(r_i-r_m | Friday) - mean(r_i-r_m | Monday), persistent Friday-strength/Monday-weakness predicts continuation."
    raw_formula: "friday_mean = mean(r_i-r_m | dayofweek==4, w=60, min_periods=3); monday_mean = mean(r_i-r_m | dayofweek==0, w=60, min_periods=3); friday_mean - monday_mean."
  month_end_calendar_relative_return:
    direction: 1
    window: 120
    hypothesis: "Master's own spec, originally 'last 3 TRADING days of the month' (month-end flow seasonality persistence), replaced 2026-09-23 (master approved) with a CALENDAR-DAY proxy after the trading-day-count version was found to have a genuine leakage issue: whether a day within the still-open current month is one of its last 3 trading days cannot be known until the month has actually ended (observing the following month's first trading day), which fails leakage_checks's truncation-invariance test for any cut falling mid-month -- confirmed via a dedicated unit test before this config was drafted, not merely suspected. The calendar-day proxy uses only each date's own intrinsic day-of-month/days-in-month, hence is provably leak-free under any truncation. direction +1 unchanged."
    raw_formula: "month_end_day(t) = day-of-month(t) >= days-in-month(t) - 4 (the last 5 calendar days of the month); mean(r_i-r_m | month_end_day, w=120, min_periods=8). ~18 qualifying days expected per master's own estimate (~6 months x 3 trading days); coverage may run COVERAGE_INSUFFICIENT (n<360) at the evaluation stage -- expected, not a code defect."
