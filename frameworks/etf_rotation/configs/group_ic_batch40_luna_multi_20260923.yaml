mechanisms:
  l40_gap_range_absorption:
    direction: 1
    raw_formula: g_t=Open_t-Close_(t-1), b_t=Close_t-Open_t；20日均值 sign(g_t)*b_t/(High_t-Low_t)。零gap记0（没有缺口方向确认）；零区间缺失。要求连续20日有效合法OHLC及前收。
    hypothesis: 实体沿缺口方向收盘，表示当日价格发现确认隔夜方向。
    family: gap_range_price_discovery
    nearest_previous: gap_repair_signed_magnitude / overnight_intraday_switch_rate
    distinction: 衡量当日实体沿隔夜缺口方向的区间内确认，不是缺口修复幅度/切换率
  l40_gap_range_extension:
    direction: 1
    raw_formula: g_t=Open_t-Close_{t-1}；对g>0取max(High-Open,0)/|g|；对g<0取max(Open-Low,0)/|g|。20日均值；零gap缺失。
    hypothesis: 当日区间沿gap方向延伸的幅度相对缺口越大，开盘跳变后价格发现越强。
    family: gap_range_price_discovery
    nearest_previous: gap_repair_signed_magnitude / gap_shock_range_recovery
    distinction: 仅测open之后朝缺口方向的high/low延伸距离相对初始gap，不看回补比例或close修复。
  l40_gap_fill_fraction_capped:
    direction: 1
    raw_formula: 20日均值：gap>0时clip((Open-Low)/gap,0,1)，gap<0时clip((High-Open)/abs(gap),0,1)；零gap缺失
    hypothesis: 缺口在当日交易区间中得到部分回补，表示开盘跳变被吸收；方向+1表示回补比例高。
    family: gap_range_price_discovery
    nearest_previous: gap_repair_signed_magnitude
    distinction: 按当日高低区间截断的比例，不采用超额或signed gap修复金额
  l40_gap_overshoot_frequency:
    direction: -1
    raw_formula: 连续20日有效合法OHLC及前收窗口中，mean(1[(gap>0 and Low<前收) or (gap<0 and High>前收)])；零gap为非事件，分母固定20；窗口输入缺失或非法则缺失。
    hypothesis: gap方向被当日区间完全反穿的频率高，表示开盘跳变质量低。
    family: gap_range_price_discovery
    nearest_previous: gap_repair_completion_rate / gap_shock_range_recovery
    distinction: 计数区间跨越前收事件，不衡量收盘完成修复或区间恢复
