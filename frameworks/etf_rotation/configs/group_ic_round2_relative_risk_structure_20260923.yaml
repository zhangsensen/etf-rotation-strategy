mechanisms:
  high_low_vol_beta_gap:
    direction: -1
    window: 60
    hypothesis: "beta(r_i,r_m) on the market's own high-realized-vol days minus the same beta on its low-vol days (both within the trailing 60-day window; high/low is self-referential: a day is high-vol if the market's trailing 5-day realized vol on that day is at or above the trailing-window rolling median of that same 5-day vol series). Larger positive gap means the name's market exposure amplifies specifically when overall uncertainty is elevated; direction -1 expects that amplification to predict relative weakness. Same conditional-beta-difference construction as beta_asymmetry (already HAS_LEADS), conditioning on the market's volatility regime instead of the sign of its return."
    raw_formula: "beta(r_i on r_m | market_vol5>=rolling_median(market_vol5,60), w=60) - beta(r_i on r_m | market_vol5<rolling_median(market_vol5,60), w=60); market_vol5 = rolling_std(r_m, 5); conditional min_periods=max(10,60//4)=15; r_m is the fixed14 leave-none equal-weight mean (etf_group_daily_rounds._market_residuals's market leg)."
  lag1_beta_to_market:
    direction: 1
    window: 60
    hypothesis: "Dense rolling beta of today's member return on YESTERDAY's market return: beta(r_i,t on r_m,t-1), w=60. A persistently positive lag-1 beta marks a name whose price keeps catching up to information the market already priced in the day before (slow diffusion / non-synchronous trading); direction +1 expects that catch-up tendency to continue predicting near-term relative strength."
    raw_formula: "rolling_beta(r_m.shift(1), r_i, w=60, min_periods=60); r_m as above. FAMILY-ADJACENCY CAVEAT (see notes.family_precheck): distinct from, but structurally close to, two already-tested daily_rounds families at window=20 -- peer_lag_return_beta (beta of own return on the OTHER 13 members' lagged mean, DO_NOT_REPEAT) and lead_to_market (a DIFFERENCE of two opposite-direction lead-lag correlations, NO_DIRECTIONAL_LEAD). Cleared the no-label dedup precheck (max 0.647 vs lead_to_market_60, 0.575 vs peer_lag_return_beta_20, both <0.7) but is flagged for reviewer judgment given the adjacency, not silently registered as unambiguously distinct."
  residual_skew_gap:
    direction: 1
    window: 60
    hypothesis: "skew(r_i-r_m | r_m>0) - skew(r_i-r_m | r_m<0), w=60. A larger (more positive) gap means the name's idiosyncratic-return distribution is more favorably (right-)skewed specifically when the market rises than when it falls -- an upside-optionality/resilience signal; direction +1 expects that asymmetry to predict relative strength."
    raw_formula: "skew(residual | r_m>0, w=60, conditional min_periods=15) - skew(residual | r_m<0, w=60, conditional min_periods=15); residual = r_i - r_m; skew is pandas' unbiased sample skew on the masked, NaN-dropped values inside each trailing window."
  residual_market_vol_corr:
    direction: -1
    window: 60
    hypothesis: "corr(market_vol5, |r_i-r_m|), w=60, dense. Does the name's idiosyncratic return dispersion expand specifically when the market's own realized volatility expands, i.e. does idiosyncratic risk fail to diversify away exactly when overall risk is elevated; direction -1 expects that pro-cyclical idiosyncratic dispersion to predict relative weakness."
    raw_formula: "rolling_corr(market_vol5, abs(r_i-r_m), w=60); market_vol5 = rolling_std(r_m, 5); r_m as above."
