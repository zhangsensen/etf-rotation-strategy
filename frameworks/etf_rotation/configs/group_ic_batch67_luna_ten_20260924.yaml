mechanisms:
  l67_median_residual_return:
    direction: 1
    raw_formula: m_{-i,t}=mean_{j≠i}(r_j,t), e_i,t=r_i,t−m_{-i,t}; factor=median(e_i,t
      over the 20 consecutive trading dates ending at D). Any missing required return
      in the contiguous window invalidates the factor.
    hypothesis: Typical relative performance resists domination by a few extreme sessions.
    family: robust_relative_return_location
    nearest_previous: market_residual_mean_20 (arithmetic mean, not temporal median);
      l37_central_return_bias (median-minus-mean own-return distribution statistic).
    distinction: The target is the median of daily fixed-pool residuals, not the cross-sectional
      median benchmark (which would preserve the same per-date rank as market_residual_mean).
      Each factor uses a fixed contiguous 20-row trailing window; missing required
      inputs invalidate that window rather than compressing dates.
  l67_trimmed_peer_relative_return:
    direction: 1
    raw_formula: For each t and i, trim the highest and lowest of the other 13 ETF
      close-to-close returns; q_i,t=r_i,t−mean(trimmed 11 peers); factor=mean(q_i,t
      over 20 dates).
    hypothesis: A relative return signal benchmarked against the broad peer body is
      less distorted by one peer's extreme move.
    family: robust_relative_return_location
    nearest_previous: market_residual_mean_20 / median_residual_return; leave-one-out
      peer return mean differs from a trimmed-peer benchmark.
    distinction: Peer-tail trimming changes the daily comparison basket; this is not
      a window substitution. Signed mean margin rather than event frequency. Each
      factor uses a fixed contiguous 20-row trailing window; missing required inputs
      invalidate that window rather than compressing dates.
  l67_cross_sectional_relative_zscore:
    direction: 1
    raw_formula: z_i,t=(r_i,t−mean_{14}(r_t))/std0_{14}(r_t); factor=mean(z_i,t over
      20 dates), requiring positive cross-sectional std.
    hypothesis: Repeated strong placement after scaling each day's relative move by
      that day's fixed-pool dispersion measures standardized leadership.
    family: robust_relative_return_location
    nearest_previous: market_residual_mean_20 (unscaled residual); vol_scaled_momentum_60
      (own time-series risk scaling).
    distinction: Normalizes by same-date cross-sectional dispersion rather than own
      historical volatility or a rolling window. Each factor uses a fixed contiguous
      20-row trailing window; missing required inputs invalidate that window rather
      than compressing dates.
