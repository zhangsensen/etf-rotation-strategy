mechanisms:
  us_style_same_day_response:
    direction: 1
    family: external_us_value_growth_style_transmission
    hypothesis: A US large-cap value-over-growth move contains global style positioning information. ETF groups with stronger prior positive response may continue to outperform over H5 during gradual cross-market style rotation.
    raw_formula: On China D, x_D is the latest strictly prior US common-date Nasdaq US Large Cap Value price-index daily return minus Growth price-index daily return. score_i=beta0_i,D-1*x_D; beta0=cov(r_i,t,x_t)/var(x_t), ddof=0, exactly 60 complete China-session pairs t=D-60..D-1. D ETF return and x_D do not enter beta.
  us_style_delayed_response:
    direction: 1
    family: external_us_value_growth_style_transmission
    hypothesis: Cross-market value-growth reallocations may reach ETF groups with one-China-session delay; a signed historical delayed response may continue into H5.
    raw_formula: score_i=beta1_i,D-1*x_D; beta1=cov(r_i,t,x_(t-1))/var(x_(t-1)), ddof=0, exactly 60 complete ETF-return China-session pairs t=D-60..D-1 and prior-China-session aligned style shocks. Current D inputs do not enter beta.
  us_style_sign_asymmetry:
    direction: 1
    family: external_us_value_growth_style_transmission
    hypothesis: Value-led and growth-led global reallocations may propagate at different speeds; signed conditional responses may persist over H5.
    raw_formula: On exactly 60 complete pairs t=D-60..D-1 estimate beta_plus on x_t>0 and beta_minus on x_t<0, each requiring >=10 historical dates, ddof=0. score_i=beta_plus_i,D-1*x_D if x_D>0, beta_minus_i,D-1*x_D if x_D<0; missing if x_D=0. D inputs do not enter beta.
notes:
  population: fixed 14 candidate ETFs and eight economic groups; the two US indexes are auxiliary information only
  external_source: Nasdaq US Large Cap Value and Growth price indexes via FRED NASDAQNQUSLV/NASDAQNQUSLG; https://fred.stlouisfed.org/series/NASDAQNQUSLV and https://fred.stlouisfed.org/series/NASDAQNQUSLG; Nasdaq style methodology https://indexes.nasdaq.com/docs/methodology_USStyleFamily.pdf
  foreign_timing: First intersect valid US dates for both price index levels, then compute each daily percentage return against the same previous common US date; x_us=return_value-return_growth. For China D use the most recent US observation strictly before D and no more than five calendar days old. Same-calendar-date US close is forbidden.
  source_vintage: Current FRED snapshots trimmed to 2026-03-24 and byte-hashed, not point-in-time archives; later index corrections/revisions possible. Both same-US-date prices must exist. Nasdaq US close may be corrected through 17:15 ET; strict prior-US-date alignment makes that close available by China D.
  sign_story: Positive x_D means US large-cap value beat growth on the latest known common US date. Groups with prior positive response to value-led style moves may continue to rank higher over H5 if global allocation transmits slowly; negative x_D reverses the predicted relative ranking. This is a falsifiable one-sided continuation hypothesis, not an observed fact.
  overlap_risk: Domestic cn_mid_large_style_transmission_60 is size, not value-growth, but is a named near neighbor. R01/R02 external scores, us_lagged_transmission_60 and all indexed definitions require no-label rank correlation; different source alone does not establish independent information.
  historical_status: PREVIOUSLY_SEEN_2025_PLUS_NOT_OOS
  decision_boundary: Proposal only; master formal approval required before registration or H5 label read.
