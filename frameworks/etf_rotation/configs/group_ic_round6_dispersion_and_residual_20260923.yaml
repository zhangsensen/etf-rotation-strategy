mechanisms:
  dispersion_conditional_beta_gap:
    direction: -1
    window: 60
    hypothesis: "beta(r_i,r_m) on the 8-economic-group cross-sectional return-dispersion top tercile days minus the same beta on the bottom tercile days, within the trailing 60-day window; dispersion is the daily std across the 8 groups' own equal-weight mean returns (all 8 groups valid that day). Same conditional-beta-difference construction as beta_asymmetry/high_low_vol_beta_gap/quantile_beta_gap, conditioning on USER's own cross-sectional-dispersion regime instead of return sign or volatility level. direction -1: amplified beta specifically in high-dispersion regimes is a risk-concentration signal, predicting relative weakness."
    raw_formula: "dispersion(t) = std_8(group_mean_return_g(t)); tercile thresholds are dispersion's own trailing-60-day rolling 1/3 and 2/3 quantiles (causal); conditional min_periods=10 (tercile subset, same floor as quantile_beta_gap); beta via the same raw-moment covariance/variance formula used throughout this module."
  residual_variance_ratio_1_5:
    direction: 1
    window: 60
    hypothesis: "Variance-ratio-test style statistic: Var(5-day overlapping cumulative market-residual return)/(5*Var(1-day residual return)), both variances over the trailing 60-day window. VR>1 marks trending/positively-autocorrelated residual returns; VR<1 marks mean-reversion. direction +1: residual trendiness predicts continuation."
    raw_formula: "residual=r_i-r_m; residual_5d=rolling_sum(residual,5); VR=rolling_var(residual_5d,60)/(5*rolling_var(residual,60)); dense, min_periods=60 both variances."
  residual_sign_run:
    direction: 1
    window: 60
    hypothesis: "Average run length of consecutive same-sign market-residual days within the trailing 60-day window: (count of valid days)/(1+count of sign flips between consecutive valid days). direction +1: longer average sign persistence marks a trending residual, predicting continuation."
    raw_formula: "Computed via rolling().apply() per column; requires >=30 valid days in the window or NaN; sign flips counted between consecutive non-NaN residual values only."
  residual_drawdown:
    direction: -1
    window: 60
    hypothesis: "Maximum drawdown (most negative trough-minus-running-peak, always <=0) of the cumulative market-residual-return PATH, computed fresh within each trailing 60-day window (the path restarts at its own first value each window, no implicit pre-existing peak, no cross-window path dependence). A different object from the already-closed own-drawdown family (daily_rounds:close_drawdown_topology, DO_NOT_REPEAT): this is drawdown of the MARKET RESIDUAL path (r_i-r_m cumulated), not the member's own raw price path -- confirmed distinct by the no-label dedup precheck below (max 0.6235, well under 0.7), not assumed a priori. direction -1: master's own spec."
    raw_formula: "residual=r_i-r_m; per 60-day window (full window required, any gap -> NaN): cum=cumsum(residual_window); running_max=running maximum of cum; max_drawdown=min(cum-running_max) (always <=0)."
