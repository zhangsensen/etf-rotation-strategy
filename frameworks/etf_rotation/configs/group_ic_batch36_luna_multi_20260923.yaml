mechanisms:
  l36_max_close_drawdown_depth:
    direction: -1
    raw_formula: 对20日完整收盘序列按日期顺序枚举；峰值为每个谷值前（含当日）最高close，峰值并列取最早日期；回撤比=(峰close-谷close)/峰close，取最大值；最大回撤并列取最早谷值。
    hypothesis: 水下时间只数天数；深回撤深度更直接反映路径损伤。
    family: close_drawdown_topology
    nearest_previous: underwater_time_share
    distinction: duration改为归一化峰谷深度，非时间变体
  l36_max_close_runup_depth:
    direction: 1
    raw_formula: 20日收盘序列最大谷峰涨幅 / 谷值
    hypothesis: 最大向上行程代表显著需求主导，不等同累计动量。
    family: close_drawdown_topology
    nearest_previous: return_acceleration_5 / momentum
    distinction: 单段极值 excursion，非累计收益/加速度
  l36_drawdown_recovery_fraction:
    direction: 1
    raw_formula: 在完整20日收盘序列内按日期顺序确定最深比例回撤：每个谷值使用其之前含当日运行最高close（并列峰取最早），最大回撤并列取最早谷；无回撤记0。分数=(窗口末close-谷close)/(峰close-谷close)，不截断。
    hypothesis: 深回撤后至窗口末恢复比例更高，表示价格韧性。
    family: close_drawdown_topology
    nearest_previous: underwater_time_share
    distinction: 刻画回撤后收复比例，不刻画处于水下时间
  l36_drawdown_depth_concentration:
    direction: 1
    raw_formula: 对20日收盘按日期顺序，以截至当日运行峰值（并列峰取最早日期）算逐日正回撤深度d_t=(peak_t-close_t)/peak_t；max(d_t)/sum(d_t)，总深度为0则缺失。
    hypothesis: 回撤深度集中于少数日期而非反复累积，代表下行损伤较集中、较易消化。
    family: close_drawdown_topology
    nearest_previous: downside_semivariance_share
    distinction: 峰值路径深度集中度，不是平方收益下行方差占比
