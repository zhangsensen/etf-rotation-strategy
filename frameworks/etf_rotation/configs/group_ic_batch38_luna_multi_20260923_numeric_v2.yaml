mechanisms:
  l38_open_excursion_balance_mean:
    direction: 1
    raw_formula: 20日均值 b_t，其中 b_t=((High-Open)-(Open-Low))/(High-Low)，零区间缺失。
    hypothesis: 平均极值空间偏向开盘上方，表示上行空间主导。
    family: open_anchored_range_geometry
    nearest_previous: wick_demand / intraday_body_utilization
    distinction: 窗口均值给出净偏斜方向；不等同偏斜绝对幅度、时间依赖或符号稳定性。
  l38_open_excursion_imbalance_magnitude:
    direction: -1
    raw_formula: 20日均值 |b_t|，b_t=((High-Open)-(Open-Low))/(High-Low)。
    hypothesis: 极值空间长期偏向单侧、而非两侧均衡，提示日内区间失衡。
    family: open_anchored_range_geometry
    nearest_previous: range_body_ratio_dispersion
    distinction: 对逐日偏斜取绝对值后平均，只度量失衡强度而不保留偏斜方向；不与有符号均值同排名逻辑。
  l38_open_excursion_balance_ar1:
    direction: 1
    raw_formula: 20日b_t序列的一阶Pearson自相关，至少完整窗口且零方差缺失。
    hypothesis: 开盘锚定的上下空间优势持续，可能反映方向性价格发现。
    family: open_anchored_range_geometry
    nearest_previous: intraday_body_ar1
    distinction: 自相关对象是区间在open两侧的分配，不是open-close实体符号/幅度。
  l38_open_excursion_sign_switch_rate:
    direction: -1
    raw_formula: 20日b_t非零符号相邻切换次数/(有效相邻对数)，b_t=0的日子不计。
    hypothesis: 上、下空间主导频繁切换表示日内区间方向供需不稳定。
    family: open_anchored_range_geometry
    nearest_previous: overnight_intraday_switch_rate
    distinction: 只看每日high/low相对open两侧空间优势的跨日切换，不比较隔夜与日内收益符号。
