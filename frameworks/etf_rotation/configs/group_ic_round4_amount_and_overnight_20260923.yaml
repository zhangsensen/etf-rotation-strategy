mechanisms:
  amount_beta_to_market_amount:
    direction: -1
    window: 60
    hypothesis: "beta(amount_change_i, market_amount_change), dense rolling window, amount_change=amount.pct_change(), market_amount_change=fixed14 equal-weight mean on all-14-valid dates. A name whose trading-activity surges amplify in lockstep with aggregate market trading activity is treated as a liquidity-herding/crowding signal; direction -1."
    raw_formula: "rolling_beta(market_amount_change, amount_change_i, w=60, min_periods=60); dense, no conditional masking."
  volume_surge_relative_return:
    direction: 1
    window: 60
    hypothesis: "mean(r_i-r_m) on the member's OWN high-trading-activity days (its own amount in the trailing window's own top 20%, a per-member threshold) minus the same conditional mean on its own ordinary-activity days: volume confirming price, a standard technical-analysis heuristic. direction +1: relative-return confirmation on the member's own high-activity days predicts continuation."
    raw_formula: "surge_day = amount>=rolling_quantile(amount,0.80,w=60); mean(r_i-r_m | surge_day, min_periods=3) - mean(r_i-r_m | ~surge_day, min_periods=15); r_m as fixed14 leave-none equal-weight mean."
  overnight_momentum_relative_market:
    direction: 1
    window: 60
    hypothesis: "Rolling mean of (overnight_i - overnight_market), overnight=open/prev_close-1, overnight_market=fixed14 all-complete equal-weight mean of the overnight leg (same leg-specific market definition overnight_intraday_beta_gap already uses). A persistent positive relative overnight edge is treated as momentum; direction +1 expects persistence to predict continuation."
    raw_formula: "rolling_mean(overnight_i - overnight_market, w=60, min_periods=60)."
  overnight_intraday_sign_consistency_relative_market:
    direction: 1
    window: 60
    hypothesis: "Rate at which this member's own overnight and intraday returns share the SAME sign (open-to-close trend continuation day) minus the analogous rate for the market itself (each leg's own fixed14 all-complete equal-weight mean). direction +1: a name whose overnight-to-intraday moves reinforce more often than the market's own baseline rate is treated as a trend-confirmation signal, predicting continuation."
    raw_formula: "own_rate = rolling_mean(1[sign(overnight_i)==sign(intraday_i)], w=60, min_periods=60); market_rate = rolling_mean(1[sign(overnight_market)==sign(intraday_market)], w=60, min_periods=60); own_rate - market_rate. FAMILY-ADJACENCY CAVEAT (see notes.family_precheck): distinct from, but structurally close to, the already-tested daily_rounds:overnight_intraday_switch_rate (compares sign(FULL close-to-close return) vs sign(intraday), no market benchmark, absolute level not a relative rate)."
