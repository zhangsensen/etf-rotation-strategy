mechanisms:
  l70_negative_residual_recovery_rate:
    direction: 1
    raw_formula: e_i,t=r_i,t−mean_{j≠i}(r_j,t); in the 20 consecutive valid daily
      transitions ending at D, count(e_i,t−1<0 and e_i,t>0)/count(e_i,t−1<0); NaN
      when denominator is zero. A missing required return in a transition invalidates
      the window.
    hypothesis: A high probability of recovering after relative weakness indicates
      resilient demand.
    family: negative_residual_recovery
    nearest_previous: market_residual_turning_rate (all sign changes, not specifically
      negative-to-positive conditional probability).
    distinction: Conditional transition probability, not total turning frequency or
      return magnitude. Each factor uses a fixed contiguous 20-row trailing window;
      missing required inputs invalidate that window rather than compressing dates.
  l70_negative_residual_recovery_magnitude:
    direction: 1
    raw_formula: In 20 consecutive valid daily transitions ending at D, mean(e_i,t
      | e_i,t−1<0 and e_i,t>0); NaN if no successful recovery event. Missing required
      returns invalidate the window.
    hypothesis: The size of successful one-session recoveries measures rebound force
      after relative weakness.
    family: negative_residual_recovery
    nearest_previous: market_residual_upside_mean / l39_lower_tail_nextday_rebound
      (unconditional positive residuals / own-tail response).
    distinction: Conditions on prior negative peer-relative residual and successful
      sign recovery. Each factor uses a fixed contiguous 20-row trailing window; missing
      required inputs invalidate that window rather than compressing dates.
  l70_negative_residual_nextday_mean:
    direction: 1
    raw_formula: In 20 consecutive valid daily transitions ending at D, mean(e_i,t
      | e_i,t−1<0); NaN if no prior-loss event. Missing required returns invalidate
      the window.
    hypothesis: Average next-session performance after relative weakness measures
      whether losses resolve quickly or persist.
    family: negative_residual_recovery
    nearest_previous: market_residual_mean / market_residual_turning_rate.
    distinction: Conditional next-day mean includes both continued losses and recoveries;
      distinct from recovery rate and successful-rebound magnitude. Each factor uses
      a fixed contiguous 20-row trailing window; missing required inputs invalidate
      that window rather than compressing dates.
