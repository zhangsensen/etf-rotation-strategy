mechanisms:
  l43_peer_amount_inflow_breadth:
    direction: 1
    raw_formula: b_i,t=(sum over all14 of 1[e_j,t>0] - 1[e_i,t>0])/13; mean over20
      complete dates, then fixed-member group mean. Thus cross-sectional relative
      score is inverse own positive-activity frequency plus a common pool term; amount
      is trading activity, not capital inflow.
    hypothesis: This is a leave-one-out inverse own positive-activity frequency plus
      a common pool-breadth term, not an independent cross-sectional breadth measure.
      Positive direction predicts stronger relative scores for members with fewer
      positive-activity dates.
    family: relative_activity_breadth
    nearest_previous: daily:breadth; amount_innovation_sign_entropy_20
    distinction: 'Not an exact repeat: prior breadth uses return-sign breadth, while
      this uses fixed-pool amount-innovation sign and leave-one-out construction;
      prior amount sign entropy is symmetric binary entropy, not positive-sign frequency.
      Interpretation is explicitly inverse own positive-activity frequency after the
      common term.'
  l43_peer_amount_inflow_disagreement:
    direction: -1
    raw_formula: For each i,t compute population std of the 13 leave-one-out peer
      amount innovations e_j,t; score mean over previous 20 dates; group fixed-member
      mean.
    hypothesis: High disagreement among peer ETF capital flows indicates fragmented
      rotation and weak common validation of a member's demand environment.
    family: relative_activity_breadth
    nearest_previous: amount_concentration_20; market_residual_abs_cluster_20
    distinction: Dispersion across contemporaneous fixed-pool peer ETFs, not concentration
      of one ETF's own amounts through time or residual return clustering.
  l43_peer_flow_breadth_change:
    direction: 1
    raw_formula: Score mean of b^-i_t - b^-i_(t-1) over 20 complete dates, with b^-i
      as the peer amount-inflow fraction; aggregate fixed-member mean.
    hypothesis: Rising participation breadth signals diffusion of capital inflows
      across competing ETFs.
    family: relative_activity_breadth
    nearest_previous: amount_innovation_abs_change_20; breadth
    distinction: This is change in fixed-pool peer sign breadth, not own absolute
      amount innovation change or positive-return breadth.
  l43_peer_flow_dispersion_change:
    direction: -1
    raw_formula: For each member compute d^-i_t=std0(e_j,t:j!=i); score mean(d^-i_t-d^-i_(t-1))
      over 20 pairs; group fixed-member mean.
    hypothesis: Widening cross-ETF flow disagreement implies rotation fragmentation,
      expected to weaken persistent group leadership.
    family: relative_activity_breadth
    nearest_previous: amount_innovation_abs_change_20; amount_concentration_20
    distinction: Change in cross-sectional peer dispersion, not temporal absolute
      change in one instrument's amount innovation or own amount concentration.
