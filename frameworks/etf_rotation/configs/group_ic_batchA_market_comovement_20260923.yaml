mechanisms:
  beta_asymmetry:
    direction: -1
    window: 60
    hypothesis: "Downside-market beta minus upside-market beta. Larger positive asymmetry (steeper exposure on down days than up days) marks a downside-risk-concentrated name; direction -1 expects it to be relatively weaker going forward."
    raw_formula: "beta(r_i | r_m<0, w=60) - beta(r_i | r_m>0, w=60); beta via OLS covariance/variance of r_i on r_m within each conditional subset; r_m is the fixed14 leave-none equal-weight mean (etf_group_daily_rounds._market_residuals's market leg, all-14-complete dates only); conditional min_periods=max(10, w//4)=15 non-null observations within the 60-day window (a strict min_periods=60 is unsatisfiable on an already down/up-masked series)."
  corr_stability_20_60:
    direction: -1
    window: 60
    hypothesis: "|corr20(r_i,r_m) - corr60(r_i,r_m)|. A larger gap between the short- and long-window correlation with the market means the name's market linkage is regime-unstable; direction -1 expects instability to predict relative weakness."
    raw_formula: "abs(corr(r_i, r_m, window=20) - corr(r_i, r_m, window=60)); registered candidate window is 60 (the longer of its own two internal legs); r_m as above."
  lead_to_market:
    direction: 1
    window: 60
    hypothesis: "corr(r_i,t-1; r_m,t) - corr(r_m,t-1; r_i,t), rolling w=60. Positive means the name's past return predicts the market's next return more than the market's past predicts the name's next return, i.e. the name leads; direction +1 expects leadership to persist."
    raw_formula: "rolling_corr(r_m, r_i.shift(1), w=60) - rolling_corr(r_m.shift(1), r_i, w=60); r_m as above."
  overnight_intraday_beta_gap:
    direction: 1
    window: 60
    hypothesis: "beta(overnight_i, overnight_m, w=60) - beta(intraday_i, intraday_m, w=60), where overnight=open/prev_close-1 and intraday=close/open-1, each leg's own fixed14 equal-weight all-complete mean used as its market leg. Larger overnight-relative beta marks a name that absorbs overseas/macro information gapped-in rather than during the session; direction +1 expects that absorption exposure to persist."
    raw_formula: "beta(overnight_i on overnight_m, w=60) - beta(intraday_i on intraday_m, w=60); each of overnight_m/intraday_m is its own series' all-14-complete equal-weight mean, not r_m from the close-to-close market; min_periods=60 (dense, no conditional masking)."
