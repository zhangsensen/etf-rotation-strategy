mechanisms:
  l63_rejected_range_to_body_energy:
    direction: -1
    raw_formula: For each valid day, upper=(High-max(Open,Close))/Open, lower=(min(Open,Close)-Low)/Open,
      body=(Close-Open)/Open. Score is strict 20-day mean of (upper^2+lower^2)/body^2;
      zero body gives missing.
    hypothesis: Large excursions that fail to remain in the close body indicate rejected
      prices relative to accepted movement and predict weakness.
    family: ohlc_wick_energy_balance
    nearest_previous: wick_body_coupling_20; wick_abs_kurtosis_20
    distinction: Uses dimensionless squared upper/lower wick energy relative to body
      energy, not signed wick/body coupling or wick-distribution kurtosis.
  l63_lower_wick_to_upper_wick_energy:
    direction: 1
    raw_formula: For each valid day compute (lower^2-upper^2)/(lower^2+upper^2), where
      upper/lower are wick lengths divided by Open; zero total wick gives missing.
      Score is strict 20-day mean.
    hypothesis: Lower-wick energy dominance represents repeated downside rejection
      and predicts relative strength.
    family: ohlc_wick_energy_balance
    nearest_previous: wick_demand_20; body_wick_abs_corr_20
    distinction: Compares squared, price-normalized wick magnitudes; existing wick
      demand uses an unsquared wick imbalance and coupling candidates include body
      behavior.
