mechanisms:
  l44_peer_flow_rank_persistence:
    direction: 1
    raw_formula: Rank all 14 members’ activity innovations cross-sectionally each
      day using stable 12-significant-digit canonical scores, average ties, percentile
      ranks. Score each member by Pearson correlation over 20 complete date pairs
      of its consecutive cross-sectional percentile-rank series (ddof=0); zero variance
      => NaN; group fixed-member mean.
    hypothesis: Persistent relative flow leadership is consistent with continuing
      allocation preference rather than transitory rotation.
    family: activity_rank_dynamics
    nearest_previous: amount_concentration_20; amount_innovation_sign_entropy_20
    distinction: Uses relative rank persistence across the fixed pool; the old measures
      summarize one ETF's amount concentration or sign entropy.
  l44_peer_return_flow_confirmation:
    direction: 1
    raw_formula: For each i,t, x^-i_t=mean(r_j,t:j!=i); compute corr_20(e_i,t,x^-i_t)
      using 20 complete pairs; group fixed-member mean.
    hypothesis: A member's capital inflow confirmed by concurrent peer-market price
      strength may indicate durable thematic demand.
    family: activity_rank_dynamics
    nearest_previous: market_coskewness_20; amount_return_asymmetry_20
    distinction: Linear correlation of own amount innovation with leave-one-out peer
      return, distinct from nonlinear return coskewness and own flow/own return asymmetry.
  l44_peer_flow_lead_confirmation:
    direction: 1
    raw_formula: For each i,t calculate corr_20(e_i,t, mean(r_j,t-1:j!=i)); group
      fixed-member mean; all 14 returns/amounts complete.
    hypothesis: Own flow following a rise in peer prices is a follower-confirmation
      mechanism for continuing rotation.
    family: activity_rank_dynamics
    nearest_previous: peer_lag_return_beta_20; lagged_volume_return_corr_20
    distinction: Direction is peer return leading own flow, opposite variable roles
      to peer return beta and own lag-volume/return correlation.
  l44_peer_flow_rank_reversal:
    direction: -1
    raw_formula: Rank all 14 members’ activity innovations cross-sectionally each
      day using stable 12-significant-digit canonical scores, average ties, percentile
      ranks. On each complete 20-date grid, retain dates where member rank rose from
      t-2 to t-1, average its following rank change (rank_t-rank_(t-1)); require at
      least 4 eligible rises. Direction -1 rewards subsequent rank reversal after
      an activity-rank rise.
    hypothesis: After an ETF has risen in relative activity rank, a subsequent rank
      fall is treated as mean reversion; the frozen -1 direction rewards that reversal
      rather than penalizing deterioration in general.
    family: activity_rank_dynamics
    nearest_previous: amount_innovation_abs_change_20; return_acceleration_5
    distinction: Measures change in fixed-pool relative amount-flow rank, not own
      amount magnitude changes or price acceleration.
