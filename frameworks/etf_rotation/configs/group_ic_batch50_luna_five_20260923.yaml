mechanisms:
  l50_peer_body_to_member_gap_beta:
    direction: 1
    raw_formula: 令x_i,t为其他13只前一日body_{j,t-1}=Close_{j,t-1}/Open_{j,t-1}-1等权均值；响应为本ETF当日gap_i,t=Open_{i,t}/Close_{i,t-1}-1。固定14成员完整行，最近20个(x_i,t,gap_i,t)配对总体OLS
      beta，ddof=0，零方差/缺失NaN。
    hypothesis: 同业前日盘中实体方向延续到本ETF次日开盘，表示隔夜跨品种价格发现。
    family: peer_intraday_price_transmission
    nearest_previous: l47_prior_body_to_next_gap_corr; l49_peer_gap_to_member_gap_beta
    distinction: 本ETF响应于跨ETF peer body聚合，而不是个体自身body或同业gap。
  l50_peer_body_to_member_body_beta:
    direction: 1
    raw_formula: 令x_i,t为其他13只前一日body_{j,t-1}=Close_{j,t-1}/Open_{j,t-1}-1等权均值；响应为本ETF当日body_i,t=Close_{i,t}/Open_{i,t}-1。固定14成员完整日，最近20完整配对总体OLS
      beta，ddof=0；零方差/缺失NaN。
    hypothesis: 同业盘中方向跨日延续到本ETF实体，反映更慢的相对资金轮动。
    family: peer_intraday_price_transmission
    nearest_previous: peer_lag_return_beta_20; l49_peer_gap_to_member_body_beta
    distinction: 传导源明确为前日peer intraday body，不是peer close-close收益或peer overnight gap。
  l50_peer_body_to_member_range_beta:
    direction: -1
    raw_formula: 以其他13只前一日|body_{j,t-1}|等权均值为x_i,t，响应为本ETF当日relrange_i,t=(High_{i,t}-Low_{i,t})/Close_{i,t-1}；固定14成员完整日，最近20完整配对总体OLS
      beta (ddof=0)，零方差/缺失NaN。
    hypothesis: peer前日盘中实体幅度放大本ETF次日波动区间，表示风险传播。
    family: peer_intraday_price_transmission
    nearest_previous: l49_peer_gap_to_member_range_beta; l42_peer_flow_impact_instability_20
    distinction: shock变量是peer intraday body绝对幅度，非peer gap绝对幅度或peer成交活动。
  l50_peer_range_to_member_open_dislocation_beta:
    direction: -1
    raw_formula: 令x_i,t为其他13只前一日relrange_{j,t-1}=(High-Low)/Close_{j,t-2}等权均值；响应本ETF当日open
      dislocation_i,t=|Open_{i,t}/Close_{i,t-1}-1|；固定14成员完整行，最近20完整配对总体OLS beta (ddof=0)，零方差/缺失NaN。
    hypothesis: 同业前日高波幅扩大本ETF次日跳空幅度，代表风险状态传播。
    family: peer_intraday_price_transmission
    nearest_previous: l49_peer_gap_to_member_range_beta; overnight_variance_share_20
    distinction: 以peer完整日内range预测member下一日开盘dislocation；与peer gap冲击预测member当日range的时序/状态源均不同。
