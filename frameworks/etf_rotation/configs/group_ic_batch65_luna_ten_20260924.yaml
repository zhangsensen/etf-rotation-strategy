mechanisms:
  l65_midrange_drift:
    direction: 1
    raw_formula: Strict 20-day mean of ((High_t+Low_t)/2)/((High_{t-1}+Low_{t-1})/2)-1,
      requiring valid adjacent bars.
    hypothesis: Persistent movement of the full daily range center indicates repricing
      that is less sensitive to close-print placement and predicts continuation.
    family: midrange_and_gap_scale
    nearest_previous: momentum_20; close_location_20
    distinction: Uses daily range midpoint-to-midpoint returns rather than close-to-close
      return or within-bar close location.
  l65_gap_scaled_by_prior_range:
    direction: 1
    raw_formula: Strict 20-day mean of (Open_t-Close_{t-1})/(High_{t-1}-Low_{t-1});
      require valid adjacent bars and positive prior range.
    hypothesis: An opening repricing large relative to the previous session range
      represents information arrival beyond routine intraday noise and predicts continuation.
    family: midrange_and_gap_scale
    nearest_previous: gap_20; gap_abs_change_20; overnight_variance_share_20
    distinction: Signed opening gap normalized by prior day’s realized range; not
      raw gap magnitude, gap repair fraction, or overnight variance share.
