mechanisms:
  l47_prior_body_to_next_gap_corr:
    direction: 1
    raw_formula: body_t=Close_t/Open_t-1；gap_t=Open_t/Close_{t-1}-1。对最近20个完整(body_{t-1},gap_t)配对计算Pearson相关，任一序列零方差或缺失则NaN。
    hypothesis: 正向日内实体之后更常出现同向隔夜缺口，表示价格发现跨越收盘持续。
    family: close_to_open_carry
    nearest_previous: gap_lag_body_corr_20; gap_body_magnitude_coupling_20
    distinction: 旧项将前日gap与当日日内实体配对；本项将前日日内实体与次日gap配对，跨越相反的收盘边界。
  l47_prior_clv_to_next_gap_corr:
    direction: 1
    raw_formula: clv_t=(2Close_t-High_t-Low_t)/(High_t-Low_t)；与gap_{t+1}=Open_{t+1}/Close_t-1构成最近20个配对的Pearson相关；零区间/零方差/缺失则NaN。
    hypothesis: 前日收盘靠近区间高端后隔夜向上开盘，表示收盘买压延续到开盘。
    family: close_to_open_carry
    nearest_previous: clv_autocorr_20; gap_lag_body_corr_20
    distinction: CLV不是前日收益实体；响应变量是下一隔夜gap而非当前实体或CLV自身。
  l47_prior_range_to_next_gap_size_corr:
    direction: -1
    raw_formula: range_t=(High_t-Low_t)/Close_{t-1}；与|gap_{t+1}|构成最近20个完整配对的Pearson相关；零方差或缺失则NaN。
    hypothesis: 前日区间越宽，次日开盘跳变越大，体现不稳定的隔夜风险延续。
    family: close_to_open_carry
    nearest_previous: overnight_variance_share_20; ohlc_range_overlap_20
    distinction: 跨日关系连接前日全日区间与次日gap幅度，不是同窗隔夜方差占比或相邻区间交叠率。
  l47_gap_magnitude_to_next_gap_magnitude_corr:
    direction: -1
    raw_formula: 计算|gap_t|与|gap_{t+1}|最近20个完整配对的Pearson相关，gap_t=Open_t/Close_{t-1}-1；零方差或缺失则NaN。
    hypothesis: 隔夜冲击幅度成簇延续时，短窗相对强度的风险更高。
    family: close_to_open_carry
    nearest_previous: gap_abs_change_20; overnight_variance_share_20
    distinction: 度量相邻隔夜gap绝对幅度的跨日依赖，不是gap幅度变化均值或overnight方差对总方差的占比。
