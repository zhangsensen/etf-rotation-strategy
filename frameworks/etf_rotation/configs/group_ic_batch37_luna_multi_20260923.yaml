mechanisms:
  l37_upper_tail_mean_excess:
    direction: 1
    raw_formula: 20日简单收益经验q90，统计r>=q90子集的mean(r)-q90；完整20个收益，条件集为空缺失。
    hypothesis: 右尾超额幅度反映少数强势日的非线性上行贡献。
    family: return_tail_shape
    nearest_previous: market_coskewness / clv_excess_kurtosis
    distinction: 单序列收益右尾条件超额，不含市场共矩或CLV
  l37_lower_tail_mean_excess:
    direction: -1
    raw_formula: 20日简单收益经验q10，统计r<=q10子集的q10-mean(r)；正值表示左尾额外损失，完整20个收益，条件集为空缺失；方向-1。
    hypothesis: 左尾超额损失越负，价格脆弱性越高，因此方向-1。
    family: return_tail_shape
    nearest_previous: downside_semivariance_share / bipower_jump_share
    distinction: 条件尾均值超额，不是全体负收益平方占比或跳跃方差
  l37_tail_magnitude_asymmetry:
    direction: 1
    raw_formula: '[mean(r|r>=q90)+mean(r|r<=q10)]/mean(|r|)，q90/q10来自完整20日收益窗；分母为0或尾集合为空缺失。'
    hypothesis: 右尾均值与负左尾均值之和相对典型波动为正时，上尾贡献更强；方向+1。
    family: return_tail_shape
    nearest_previous: market_residual_skew / gap_excess_kurtosis
    distinction: 原始日收益两侧条件均值差，不是残差偏度或gap矩
  l37_central_return_bias:
    direction: 1
    raw_formula: 20日收益中位数 - 算术均值；除以收益绝对值中位数
    hypothesis: 典型日表现强于均值可表示收益不依赖少数极端日的分布稳健性。
    family: return_tail_shape
    nearest_previous: return_concentration / return_acceleration_5
    distinction: 中位数与均值偏离，非收益集中度或时序加速度
