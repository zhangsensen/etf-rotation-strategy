  group_return_autocorrelation_relative:
    direction: 1
    window: 60
    hypothesis: "MY_ASSUMPTION. Master gave no formula or angle for round 10 (both 9 and 10 fully self-devised). Each member's factor value is its OWN ECONOMIC GROUP's trailing lag-1 return autocorrelation (group_returns_df, the same 8-group equal-weight all-members-valid construction round 7's beta_to_leader_group and round 6's dispersion candidates use) -- a regime indicator: is this member's sector currently in a trending (positive autocorrelation) or choppy/mean-reverting (negative autocorrelation) state. A genuinely unexplored axis: neither claude_rounds' own family list nor the cross-engine daily_rounds/minute rows in the shared families.csv registry have any group_momentum/group_rank/group_autocorr/group_leader entry. Different statistic and lag structure from tsmom_consistency (20-day BLOCK sign-consistency, already registered, DO_NOT_REPEAT_TESTED_VARIANTS_WITHOUT_NEW_INFORMATION) and from daily_rounds:market_residual_sign_persistence/_turning_rate (per-MEMBER residual, not per-GROUP raw return). For the 6 single-member economic groups (hk_technology, us_large_growth, gold, metals_equity, dividend_low_vol, electric_power) this reduces to that member's own raw-return lag-1 autocorrelation (no group-aggregation effect for those 6, disclosed not hidden); only the 2 multi-member groups (cn_technology_manufacturing, innovative_pharma) get genuine group-level aggregation. direction +1: membership in a currently trending group predicts relative continuation."
    raw_formula: "group_returns = 8-group equal-weight mean return (all members of that group valid); lag1_autocorr = group_returns.rolling(60).corr(group_returns.shift(1)); each member's factor value = its own group's lag1_autocorr that day."
