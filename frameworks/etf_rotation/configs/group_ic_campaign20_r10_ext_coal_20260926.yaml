mechanisms:
  coal_same_day_response:
    direction: 1
    family: external_coal_fuel_cost_transmission
    hypothesis: A settlement rise in DCE coking-coal futures reflects rising upstream fuel and raw-material cost pressure. ETF groups with a more positive historical contemporaneous response to that signed coal shock may continue to reprice over H5; a coal fall reverses the predicted ranking. This is the single-source cost-shock version of the roadmap coal-power mechanism; the two-leg coal-power spread is explicitly not claimed.
    raw_formula: On China D, x_D=log(settle_D/settle_prev) using the DCE coking-coal settlement at China date D itself and the previous valid settlement (holiday gaps accumulate); dates without a futures settlement stay missing. score_i=beta0_i,D-1*x_D, where beta0=cov(r_i,t,x_t)/var(x_t), ddof=0, on exactly 60 complete China-session pairs t=D-60..D-1. D ETF return and x_D do not enter beta.
  coal_delayed_response:
    direction: 1
    family: external_coal_fuel_cost_transmission
    hypothesis: Fuel-cost repricing may reach domestic ETF groups with a one-China-session lag through cost pass-through chains, then continue into H5.
    raw_formula: score_i=beta1_i,D-1*x_D; beta1=cov(r_i,t,x_(t-1))/var(x_(t-1)), ddof=0, on exactly 60 complete ETF-return pairs t=D-60..D-1 with prior-China-session aligned coal shocks. D inputs do not enter beta.
  coal_sign_asymmetry:
    direction: 1
    family: external_coal_fuel_cost_transmission
    hypothesis: Coal rallies driven by supply restriction may transmit differently from coal slides driven by demand weakness; each signed response may continue over H5.
    raw_formula: On exactly 60 complete pairs t=D-60..D-1 estimate beta_plus using x_t>0 and beta_minus using x_t<0, requiring at least 10 historical dates in each branch; ddof=0. score_i=beta_plus_i,D-1*x_D if x_D>0, or beta_minus_i,D-1*x_D if x_D<0; missing if x_D=0. D inputs do not enter beta.
notes:
  population: fixed 14 candidate ETFs and eight economic groups; DCE coking coal is auxiliary information only
  external_source: DCE coking-coal front continuous futures daily settlement from the local long-history proxy library (SHA256-pinned, trimmed to the 2026-03-24 cold cutoff); 2970 observations from 2014-01-02
  foreign_timing: Compute log settlement change on the China calendar directly. The settlement at China date t is finalized at the 15:00 futures close and is used as a close(D) input exactly like the domestic_benchmark auxiliary closes and rounds 5-6; missing futures dates stay missing and holiday gaps produce the cumulative settlement change.
  source_vintage: Local historical proxy snapshot, not a point-in-time archive; front-contract rolls and settlement revisions are limitations. This is seen-history discovery, not PIT confirmation.
  sign_story: A positive x_D means coking coal settled higher at China date D. Positive historical beta times the signed shock ranks groups that historically strengthened alongside rising fuel-cost pressure higher; a down-shock reverses the ranking. Coking coal feeds steel rather than power, so the two-leg coal-power profit-spread mechanism from the roadmap is not claimed here. One-sided continuation over D+2..D+7 is a falsifiable hypothesis, not an observed fact.
  overlap_risk: R05 copper and R06 crude share the domestic-futures transmission template with different economics; old macro and bond-trend families are additional references. Beware single-group (metals/resource) dominance in leave-one-out diagnostics, as pre-registered in the roadmap. Distinct source does not imply distinct eight-group score.
  historical_status: PREVIOUSLY_SEEN_2025_PLUS_NOT_OOS
  decision_boundary: Proposed draft only. Master approval required before registration or any new H5 label read; zero evidence is retained.
