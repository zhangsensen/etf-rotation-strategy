mechanisms:
  l49_peer_gap_to_member_body_beta:
    direction: 1
    raw_formula: 定义gap_{j,t}=Open_{j,t}/Close_{j,t-1}-1、body_{i,t}=Close_{i,t}/Open_{i,t}-1。令x_{i,t}=mean_{j≠i}(gap_{j,t-1})。对每个member
      i，在signal dates t=D-19…D的20个完整配对上估计总体OLS beta_20(body_{i,t},x_{i,t})，截距含入、ddof=0、零方差缺失。计算每个peer
      predictor/own response的日期要求全部14只OHLC完整合法。
    hypothesis: 前日同业隔夜上涨越强，本ETF次日日内实体跟进越强，体现开盘信息传导。
    family: peer_overnight_price_transmission
    nearest_previous: l41_peer_amount_to_return_beta_20; peer_lag_return_beta_20
    distinction: 预测变量是同业隔夜gap分量、响应是本ETF次日日内body；不是peer成交额创新或peer close-close收益。
  l49_peer_gap_to_member_range_beta:
    direction: -1
    raw_formula: 定义gap_{j,t}=Open_{j,t}/Close_{j,t-1}-1、range_{i,t}=(High_{i,t}-Low_{i,t})/Close_{i,t-1}。令x_{i,t}=mean_{j≠i}(|gap_{j,t-1}|)。在signal
      dates t=D-19…D的20个固定14成员完整配对上估计总体OLS beta_20(range_{i,t},x_{i,t})，截距含入、ddof=0、零方差缺失。
    hypothesis: 同业隔夜跳变引起本ETF次日区间风险放大，较强传染降低稳定相对强度。
    family: peer_overnight_price_transmission
    nearest_previous: l42_peer_flow_impact_instability_20; overnight_variance_share_20
    distinction: 是peer gap冲击对本ETF当日高低区间的传导斜率，不是peer activity斜率不稳定或单ETF隔夜风险份额。
  l49_peer_gap_to_member_gap_beta:
    direction: 1
    raw_formula: gap_{i,t}=Open_{i,t}/Close_{i,t-1}-1；令x_{i,t}=mean_{j≠i}(gap_{j,t-1})。在signal
      dates t=D-19…D的20个固定14成员完整配对上估计总体OLS beta_20(gap_{i,t},x_{i,t})，截距含入、ddof=0、零方差缺失。
    hypothesis: 同业隔夜方向对本ETF开盘方向的延续传导体现共同开盘价格发现。
    family: peer_overnight_price_transmission
    nearest_previous: l45_peer_flow_lagged_correlation_20; peer_lag_return_beta_20
    distinction: 开盘gap对开盘gap的peer lead，不是activity对activity相关或close return对peer close
      return beta。
  l49_peer_gap_to_member_downside_range_beta:
    direction: -1
    raw_formula: 定义gap_{j,t}=Open_{j,t}/Close_{j,t-1}-1、downrange_{i,t}=(Open_{i,t}-Low_{i,t})/Close_{i,t-1}。令x_{i,t}=mean_{j≠i}(gap_{j,t-1})（signed
      peer gap）。在signal dates t=D-19…D的20个固定14成员完整配对上估计总体OLS beta_20(downrange_{i,t},x_{i,t})，截距含入、ddof=0、零方差缺失；方向-1。
    hypothesis: 前一日peer正gap与本ETF当日开盘以下区间下探同向扩大时，说明自身对同业开盘上涨的吸收较弱；方向-1。
    family: peer_overnight_price_transmission
    nearest_previous: l42_peer_flow_impact_spread_20; downside_price_impact_share_20
    distinction: 响应是peer overnight gap对应的本ETF开盘以下区间距离，不是peer signed-vs-absolute amount
      slope或close-return downside variance。
