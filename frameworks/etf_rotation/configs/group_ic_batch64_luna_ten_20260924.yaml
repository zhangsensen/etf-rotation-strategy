mechanisms:
  l64_post_inside_return_spread:
    direction: 1
    raw_formula: On 20 response dates, compute mean(Close_t/Close_{t-1}-1 | inside_{t-1}=1)
      minus mean(the same return | inside_{t-1}=0); inside means High<=prior High
      and Low>=prior Low. Require all state/return pairs and both states represented.
    hypothesis: If range containment precedes positive price discovery, next-day relative
      return following inside bars should exceed the non-inside baseline.
    family: bar_state_conditional_return_spread
    nearest_previous: l48_post_inside_return_contribution_20; l48_inside_day_rate_20
    distinction: Conditional return difference with a non-inside control; existing
      post-inside contribution is the unconditional mean of inside_lag*return and
      does not subtract the control state.
  l64_post_outside_return_spread:
    direction: 1
    raw_formula: On 20 response dates, compute mean(Close_t/Close_{t-1}-1 | outside_{t-1}=1)
      minus mean(the same return | outside_{t-1}=0); outside means High>prior High
      and Low<prior Low. Require all state/return pairs and both states represented.
    hypothesis: When outside bars reflect demand absorption rather than exhaustion,
      a larger subsequent return advantage versus non-outside bars indicates continuing
      repricing and predicts stronger relative returns.
    family: bar_state_conditional_return_spread
    nearest_previous: l48_outside_day_rate_20; body_transition_asymmetry_20
    distinction: Measures next-day return conditional on outside state relative to
      a control state; existing outside rate measures frequency only.
