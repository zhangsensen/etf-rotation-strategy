mechanisms:
  l41_peer_amount_to_return_beta:
    direction: 1
    raw_formula: For each ETF i, e_i=log(amount_i)-mean(previous 20 log amounts);
      m^-i_t=mean(e_j,t for other 13 fixed ETFs). Score beta_20(r_i,t, m^-i_(t-1)),
      then fixed-member mean within each economic group.
    hypothesis: Peer activity may precede repricing in the receiving ETF; + means
      stronger response to yesterday's peer participation shock.
    family: peer_activity_transmission
    nearest_previous: peer_lag_return_beta_20 and market_residual_amount_beta_20
    distinction: Those use peer lagged returns or own amount vs own residual return.
      This uses peer amount innovation lagged against own return; requires all 14
      series.
  l41_peer_amount_return_correlation:
    direction: 1
    raw_formula: On each complete 20-pair window, Pearson correlation (population
      standard deviations, ddof=0) between member return r_i,t and one-day-lagged
      leave-one-out mean trading-activity innovation of the other 13 ETFs; zero variance
      => NaN; group fixed-member mean.
    hypothesis: Standardized cross-series co-movement captures peer-flow-led repricing;
      positive comovement predicts relative strength.
    family: peer_activity_transmission
    nearest_previous: peer_lag_return_beta_20
    distinction: 'Pearson correlation rather than the prior peer-lag-return beta:
      peer amount innovation is lagged and the receiving member return is the response.'
  l41_peer_amount_shock_response_asymmetry:
    direction: 1
    raw_formula: Over a complete 20-pair grid of lagged peer activity shock x and
      member return, mean return for x>0 minus mean return for x<0; require at least
      4 valid pairs in each state. Zero shock is excluded. Group fixed-member mean.
    hypothesis: Member prices responding more to peer inflows than peer outflows signals
      positive flow transmission.
    family: peer_activity_transmission
    nearest_previous: amount_return_asymmetry_20; peer_lag_return_beta_20
    distinction: Conditional means are keyed to lagged fixed-pool peer amount-shock
      sign, not own amount or own return sign; denominator/state support is explicit.
  l41_peer_flow_reversal_beta:
    direction: -1
    raw_formula: For each member, x_t=mean of the other 13 fixed ETFs’ activity innovations
      at t-1. Threshold at response date t is median(|peer activity|) over the 20
      observations ending t-2, known by lagged shock date t-1 and excluding that shock.
      Select |x_t| >= threshold (ties included); compute OLS slope with intercept
      beta_20(r_i,t,x_t) on selected pairs only; require at least 4 selected pairs
      and positive population variance (ddof=0); any missing threshold makes that
      date ineligible. Group fixed-member mean. Every date in the 20-pair calendar
      grid must have a known threshold, x and return; otherwise output NaN.
    hypothesis: Extreme peer-flow impulse is expected to induce short-lived crowding/reversal
      in the receiving ETF; negative sign is frozen.
    family: peer_activity_transmission
    nearest_previous: peer_lag_return_beta_20; amount_shock_*
    distinction: Extreme peer activity shock threshold is lagged-date measurable and
      evaluated against prior-20 peer activity; state slope is distinct from unconditional
      peer lag-return beta.
