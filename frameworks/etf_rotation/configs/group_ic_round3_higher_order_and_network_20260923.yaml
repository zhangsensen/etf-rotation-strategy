  originally_proposed: >-
    5 candidates: cokurtosis_60, downside_coskewness_60, avg_peer_residual_corr_60, peer_corr_network_change_60,
    peer_corr_dispersion_60. 1 dropped on the no-label dedup precheck below (not on family collision, not on
    structural diagnostics -- all 5 passed both of those cleanly).
  implementation_bug_caught: >-
    While first implementing avg_peer_residual_corr, a naive "correlate residual_i against the leave-one-out
    AVERAGE of the other 13 residuals" formulation was smoke-tested and found to return exactly +/-1 for every
    member on every date, on two independent synthetic panels (one with a shared deterministic phase term, one
    with pure independent idiosyncratic noise). Root cause: r_m is the equal-weight mean of ALL 14 members
    INCLUDING member i, so the 14 residuals sum to exactly zero at every date by construction
    (sum_k(r_k)-14*mean(r_k)==0 identically); the leave-one-out average of the other 13 is therefore an exact
    negative scalar multiple of residual_i itself (peer_i == -residual_i/13 algebraically), which correlates at
    +/-1 regardless of the underlying data -- a pure algebraic artifact, not a signal. Fixed by computing the
    TRUE average of 13 separate genuine pairwise correlations instead (91 pairs across the fixed 14-name pool),
    which carries no such identity. Regression-guarded in
    frameworks/etf_rotation/tests/test_etf_group_claude_rounds.py::test_avg_peer_residual_corr_hand_formula_and_not_degenerate
    (asserts output is not pinned near +/-1, plus a direct-numpy hand check against 13 separate pairwise
    corr() calls).
  family_precheck: >-
    checked against runtime_outputs/etf_rotation_research/ic_inventory_20260923_claude_batchAB/families.csv
    (freshest snapshot; a new snapshot is built only every 5 rounds per master's cadence decision, so rounds
    1-2's 7 registered candidates are not yet reflected as families.csv rows, but their real saved scores ARE
    in the dedup library below). No exact-duplicate under source_type=claude_rounds for any of the 5
    originally-proposed candidates. Adjacencies found and resolved: daily_rounds:market_coskewness (HAS_LEADS,
    an unconditional 3rd joint co-moment) is adjacent to downside_coskewness (a DOWN-DAY-CONDITIONAL 3rd joint
    co-moment) but is a different statistic, not re-derived under a new name; daily_rounds:
    amount_innovation_excess_kurtosis/clv_excess_kurtosis/gap_excess_kurtosis/wick_abs_kurtosis are all
    SINGLE-VARIABLE excess kurtosis of one series (not a joint co-kurtosis with the market), unrelated to
    cokurtosis despite the shared word. No existing family under any source_type mentions "peer_corr",
    "network", "centrality", or "pairwise" -- avg_peer_residual_corr/peer_corr_network_change/
    peer_corr_dispersion are the first candidates in this module's history to use a true pairwise (not
    market-vs-member) correlation structure.
  no_label_dedup_precheck: >-
    computed group scores only (no forward return/H5 label), 2025-01-01..2026-09-23, against 440 saved
    scores_*.csv files across the whole runs/ library (deduped to latest per candidate id, now including
