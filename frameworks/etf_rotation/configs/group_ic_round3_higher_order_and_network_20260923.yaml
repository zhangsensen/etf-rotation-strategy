mechanisms:
  downside_coskewness:
    direction: -1
    window: 60
    hypothesis: "Coskewness of member on market computed only on the market's own down days (r_m<0): E[(r_i-E_i)(r_m-E_m)^2 | r_m<0] / (std_i|down * var_m|down), w=60, Harvey-Siddique style downside coskewness. A name whose downside amplifies more than proportionally when the market itself is already falling predicts relative weakness; direction -1."
    raw_formula: "Conditional 3rd joint co-moment via the raw-moment expansion E[(X-EX)(Y-EY)^2]=E[XY^2]-2*EY*E[XY]+2*EX*EY^2-EX*E[Y^2], with all conditional expectations restricted to r_m<0 and computed via a Series/DataFrame conditional-mean helper (same technique as downside_correlation, Batch C); conditional min_periods=max(10,60//4)=15; r_m is the fixed14 leave-none equal-weight mean."
  avg_peer_residual_corr:
    direction: -1
    window: 60
    hypothesis: "Mean, over the other 13 members j, of corr(residual_i, residual_j), residual=r_i-r_m, w=60. Measures whether the name's idiosyncratic (market-adjusted) moves still comove with the rest of the 14-name network; higher residual crowding with peers means less true diversification value; direction -1."
    raw_formula: "TRUE average of 13 separate pairwise rolling correlations (91 pairs computed across the fixed 14-name pool), NOT a shortcut correlation against a leave-one-out linear combination of the other residuals -- that shortcut is mathematically degenerate here (see notes.implementation_bug_caught below) and was caught and fixed before registration."
  peer_corr_network_change:
    direction: -1
    window: 60
    hypothesis: "avg_peer_residual_corr on a short (20-day) window minus its own long (60-day) window value: is the name's residual connectedness to the rest of the network currently rising relative to its own recent history. Same term-structure construction as corr_stability_20_60 and residual_vol_term_structure_20_60, applied to the peer-network correlation level; direction -1: a rising peer-connectedness trend predicts relative weakness. Registered window is 60 (the longer of its own two fixed internal legs, 20 and 60)."
    raw_formula: "avg_peer_residual_corr(w=20) - avg_peer_residual_corr(w=60), each independently recomputed (not cached/shared state) from the pairwise-correlation machinery above."
  peer_corr_dispersion:
    direction: -1
    window: 60
    hypothesis: "Std, over the other 13 members j, of corr(residual_i, residual_j), w=60 -- same underlying pairwise matrix as avg_peer_residual_corr, but its DISPERSION rather than its level: is the name's connectedness to the network even (similar correlation to all 13 peers) or concentrated (highly correlated with a subgroup, near-zero with the rest). direction -1: a concentrated/uneven peer-correlation structure is treated as a crowding/fragility signal, the same directional logic already used for illiquidity_trend/downside_correlation/high_low_vol_beta_gap."
    raw_formula: "std(13 pairwise rolling correlations for member i, computed the same way as avg_peer_residual_corr's numerator, ddof=1)."
