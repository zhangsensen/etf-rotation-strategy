    avg_peer_residual_corr_60 0.6175, peer_corr_network_change_60 0.5751, peer_corr_dispersion_60 0.6612 (all
    <0.7, all clean). Dropped (>=0.7): cokurtosis_60 0.7272 (vs market_residual_market_beta_20; also 0.7071 vs
    downside_correlation_60, itself a registered claude_rounds Batch C candidate). See
    runtime_outputs/etf_rotation_research/diagnostics/round3_20260923/dedup_precheck.csv.
  eval_window_structural_precheck: >-
