mechanisms:
  minute_lead_lag_corr:
    direction: 1
    window: 20
    hypothesis: "20-trading-day rolling mean of the per-day realized correlation between each member's PRIOR 5m bar return and the market's CONTEMPORANEOUS 5m bar return (member leads market by one 5-minute bar within the same trading day only; the first bar of each day has no same-day predecessor and is NaN). direction +1: a name whose intraday moves systematically lead the market's is expected to keep leading, predicting relative strength -- same directional sign as daily_rounds' lead_to_market, a different statistic (5-minute-bar lag within a day, not a full trading day)."
    raw_formula: "Per trading day: corr(market_5m[t], member_5m[t-1]) over that single day's ~47 5m bars (pairwise-complete, min 10 valid bars or NaN); then a 20-trading-day rolling mean of that daily statistic, reindexed onto the full daily calendar. Uses data/etf_rotation_v1/5m/<symbol>.parquet (not 1m); 513100.SH's halted-open 5m bars (09:35-10:30 on days flagged by etf_ic_monthly_factory.open_halt_dates) are masked to NaN before any return is computed."
  tail_coexceedance_asymmetry:
    direction: 1
    window: 60
    hypothesis: "Upper-tail coexceedance rate minus lower-tail coexceedance rate: P(member in its own top-20% days | market in its own top-20% days) minus the analogous down-tail quantity, both within the trailing 60-day window, both sides' quantile thresholds computed causally (each day's own trailing quantile). direction +1: a name that co-exceeds with the market's upside more often than with its downside (upside beta without matching downside beta) is treated as a favorable asymmetry, predicting relative strength."
    raw_formula: "coexceed_up = mean(member_up_tail & market_up_tail) / mean(market_up_tail); coexceed_down analogous with both series' bottom-20%; coexceed_up - coexceed_down; conditional min_periods=3 (matching market_tail_relative_return's own 20%-tail floor)."
  residual_kurtosis:
    direction: -1
    window: 60
    hypothesis: "Rolling excess kurtosis (pandas' Series.kurt(), Fisher-definition, verified against scipy.stats.kurtosis(fisher=True, bias=False)) of the market residual (r_i - r_m, same market leg as etf_group_daily_rounds._market_residuals), w=60. direction -1: fatter residual tails mark elevated idiosyncratic shock risk, predicting relative weakness."
    raw_formula: "residual = r_i - r_m; rolling_kurt(residual, w=60, min_periods=60)."
