mechanisms:
  l48_inside_day_rate:
    direction: -1
    raw_formula: inside_t=1[High_t/High_{t-1}<=1+1e-12 且 Low_t/Low_{t-1}>=1-1e-12]；相对比值精度将调整价格近等视为边界包含。方向后的因子值为最近20个有效相邻完整合法OHLC日的inside比例的负值；缺失不补值。
    hypothesis: 连续区间收缩/包含较多，表示价格发现停滞。
    family: daily_range_containment_state
    nearest_previous: range_shock_compression_rate_20; ohlc_range_overlap_20
    distinction: 是当前High-Low整段被上一日High-Low包含的几何状态，不要求先有range shock，也不测连续交集宽度。
  l48_outside_day_rate:
    direction: -1
    raw_formula: outside_t=1[High_t/High_{t-1}>1+1e-12 且 Low_t/Low_{t-1}<1-1e-12]；近等边界用相对比值精度处理。方向后的因子值为最近20个有效相邻完整合法OHLC日的outside比例的负值。
    hypothesis: 上下两侧同时扩展频繁，代表方向冲突与区间不稳定。
    family: daily_range_containment_state
    nearest_previous: range_expansion_20; range_shock_direction_efficiency_20
    distinction: 外包日要求高点创新高且低点创新低同日发生；不等同区间变宽或扩张后收益方向效率。
  l48_post_inside_return_contribution:
    direction: 1
    raw_formula: ret_t=Close_t/Close_{t-1}-1；特征为最近20日的mean(inside_{t-1}*ret_t)，inside按High/Low对上一日区间包含定义；零贡献状态保留为0，完整20日相邻OHLC要求。
    hypothesis: 前一日区间收缩后出现正向实现收益，表示压缩后的方向性释放。
    family: daily_range_containment_state
    nearest_previous: range_to_return_lead_20; range_shock_compression_rate_20
    distinction: 预先由上一日区间包含状态标记，再取下一日signed close return的无条件贡献；不是对高range日的收益响应或只在事件样本内均值。
  l48_post_inside_range_contribution:
    direction: -1
    raw_formula: relrange_t=(High_t-Low_t)/Close_{t-1}；特征为最近20日的mean(inside_{t-1}*relrange_t)，未发生inside的日期贡献记0；完整20日相邻OHLC要求。
    hypothesis: 区间收缩后的次日波幅越高，压缩释放越不稳定。
    family: daily_range_containment_state
    nearest_previous: range_shock_compression_rate_20; range_shock_range_persistence_20
    distinction: 状态为前一日整根bar containment，响应为次日完整归一化区间宽度；不以当日range tail shock作条件，也不测amount响应。
