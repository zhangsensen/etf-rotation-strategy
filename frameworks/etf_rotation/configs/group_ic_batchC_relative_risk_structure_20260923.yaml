mechanisms:
  downside_correlation:
    direction: -1
    window: 60
    hypothesis: "Rolling corr(r_m, r_i) computed on down-market days only (r_m<0, w=60). Larger positive downside correlation marks a name that tracks the market tightly precisely when the market is falling, i.e. offers no diversification exactly when it would matter; direction -1 expects tighter downside tracking to predict relative weakness."
    raw_formula: "rolling_corr(r_m.where(r_m<0), r_i.where(r_m<0), w=60); r_m is the fixed14 leave-none equal-weight mean (etf_group_daily_rounds._market_residuals's market leg, all-14-complete dates only); conditional min_periods=max(10, w//4)=15 non-null observations within the 60-day window (masking to down-days only makes a strict min_periods=60 unsatisfiable)."
  beta_variability:
    direction: -1
    window: 60
    hypothesis: "Rolling std of a 20-day rolling beta(r_i, r_m) series, itself re-windowed over 60 days: std(beta_20(r_i,r_m), w=60). Larger variability in the name's own market-beta over time marks an unstable, regime-dependent market linkage; direction -1 expects instability to predict relative weakness."
    raw_formula: "beta20 = rolling_beta(r_i, r_m, w=20, min_periods=20); rolling_std(beta20, w=60, min_periods=60); r_m as above."
  residual_vol_term_structure_20_60:
    direction: -1
    window: 60
    hypothesis: "Ratio of short-window to long-window market-residual return volatility: std(r_i - r_m, w=20) / std(r_i - r_m, w=60). Values above 1 mean the name's idiosyncratic (market-adjusted) volatility has recently expanded relative to its own longer-run level; direction -1 expects that recent idiosyncratic-vol expansion to predict relative weakness. Registered window is 60 (the longer of its own two fixed internal legs, 20 and 60, which are not reparametrized by the registered window field)."
    raw_formula: "residual = r_i - r_m; short_vol = rolling_std(residual, w=20, min_periods=20); long_vol = rolling_std(residual, w=60, min_periods=60); short_vol / long_vol (only where long_vol>0); r_m as above."
