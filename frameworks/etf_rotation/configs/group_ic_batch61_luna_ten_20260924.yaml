mechanisms:
  l61_upper_breakout_rejection_depth:
    direction: -1
    raw_formula: D_t=1[High_t>U_t and Close_t<=U_t]*(U_t-Close_t)/(U_t-L_t), else
      0; U/L are max High/min Low over the 20 prior valid bars, using relative-ratio
      strictness 1e-12 at boundaries; score is strict mean over the last 20 consecutive
      valid sessions, with non-events contributing zero.
    hypothesis: A close rejection after an upper 20-day range breach records failed
      upside price discovery; deeper rejection predicts weaker relative returns.
    family: prior_range_failed_break_geometry
    nearest_previous: l46_intraday_upper_channel_penetration_20; wick_rejection_range_compression_20
    distinction: Joint prior-channel breach plus close back inside, measuring rejection
      depth; prior penetration is unconditional.
  l61_lower_breakdown_reclaim_depth:
    direction: 1
    raw_formula: D_t=1[Low_t<L_t and Close_t>=L_t]*(Close_t-L_t)/(U_t-L_t), else 0;
      U/L are max High/min Low over the 20 prior valid bars, using relative-ratio
      strictness 1e-12 at boundaries; score is strict mean over the last 20 consecutive
      valid sessions, with non-events contributing zero.
    hypothesis: A low below the prior range floor followed by a close reclaim records
      rejection of downside supply; greater reclaim depth predicts strength.
    family: prior_range_failed_break_geometry
    nearest_previous: l46_lower_channel_close_penetration_20; l46_prior_channel_close_position_20
    distinction: Requires an intraday breakdown and same-day close reclaim; existing
      lower penetration records a close below the floor.
  l61_failed_break_directional_balance:
    direction: 1
    raw_formula: Over the last 20 valid dates, mean(1[Low_t<L_t and Close_t>=L_t]
      - 1[High_t>U_t and Close_t<=U_t]); U/L use the prior 20 valid OHLC bars.
    hypothesis: More rejected downside breaks than rejected upside breaks indicate
      demand is winning failed auctions.
    family: prior_range_failed_break_geometry
    nearest_previous: l61_upper_breakout_rejection_depth; l61_lower_breakdown_reclaim_depth;
      l48_inside_day_rate_20
    distinction: Event-count asymmetry, rather than mean boundary penetration depth
      or generic range-state frequency.
