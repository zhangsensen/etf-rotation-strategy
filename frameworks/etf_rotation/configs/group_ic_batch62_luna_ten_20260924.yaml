mechanisms:
  l62_ohlc_peak_to_trough_drawdown:
    direction: -1
    raw_formula: On each complete 20-bar OHLC window, for each date k after the first,
      compute max prior High from the window start through k-1; drawdown_k=max(0,(prior_peak-Low_k)/prior_peak);
      score=max(drawdown_k).
    hypothesis: A large intraday trough below earlier highs captures path damage hidden
      by closing prices and predicts relative weakness.
    family: ohlc_extreme_path_risk
    nearest_previous: l36_max_close_drawdown_depth_20
    distinction: Uses Low and prior High, while the existing candidate uses Close-to-Close
      extrema only; no same-bar high/low order is assumed.
  l62_ohlc_trough_to_peak_runup:
    direction: 1
    raw_formula: On each complete 20-bar OHLC window, for each date k after the first,
      compute min prior Low from the window start through k-1; runup_k=max(0,(High_k-prior_trough)/prior_trough);
      score=max(runup_k).
    hypothesis: A strong intrawindow recovery from an earlier trough records demand
      not visible in close-only runup and predicts relative strength.
    family: ohlc_extreme_path_risk
    nearest_previous: l36_max_close_runup_depth_20
    distinction: Uses daily High/Low path extremes rather than close-only extrema;
      strict earlier-day comparison avoids assuming intraday order.
