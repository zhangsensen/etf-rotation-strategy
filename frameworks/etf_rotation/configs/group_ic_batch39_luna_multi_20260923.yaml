mechanisms:
  l39_upper_tail_nextday_followthrough:
    direction: 1
    raw_formula: 对事件日D-20…D-1，逐日以事件日前20个简单收益估计q90；事件定义r>q90。返回事件次日收益均值，至少2个事件；只用已实现到D的响应，需41个连续完整收益（42个收盘），窗口中缺失即缺失。
    hypothesis: 上尾冲击后继续上涨体现正向价格发现。
    family: tail_event_response
    nearest_previous: clv_extreme_recovery_rate / return_acceleration_5
    distinction: 按close-close收益上尾事件条件化次日收益，不用CLV或连续加速度。
  l39_lower_tail_nextday_rebound:
    direction: 1
    raw_formula: 对事件日D-20…D-1，逐日以事件日前20个简单收益估计q10；事件定义r<q10。返回事件次日收益均值，至少2个事件；只用已实现到D的响应，需41个连续完整收益（42个收盘），窗口中缺失即缺失。
    hypothesis: 下尾冲击后反弹体现跌势吸收。
    family: tail_event_response
    nearest_previous: market_residual_downshock_recovery
    distinction: 个体ETF原始收益尾部后的次日close-close反弹，不作横截面市场残差化，也不使用区间恢复。
  l39_tail_event_nextday_absvol_ratio:
    direction: -1
    raw_formula: 在事件日D-20…D-1中，用各事件日前20个简单收益定义r>q90或r<q10的尾事件；计算事件次日|r|均值/非事件次日|r|均值。尾/非尾各至少2日；仅用已实现到D的响应，需41个连续完整收益（42个收盘），窗口中缺失即缺失；非事件分母0则缺失。
    hypothesis: 尾部冲击后次日波动继续放大，表示价格调整不稳定。
    family: tail_event_response
    nearest_previous: bipower_jump_share / squared_return_ar1
    distinction: 比较尾部事件后的次日绝对收益与普通次日绝对收益，不估算实现跳跃份额或平方收益自相关。
  l39_tail_event_response_consistency:
    direction: 1
    raw_formula: 对事件日D-20…D-1，逐日以事件日前20个简单收益估计q90/q10，尾事件定义为r>q90或r<q10；统计事件次日收益与事件日同号的比例。必须至少2个尾事件；只用已实现到D的次日收益，需41个连续完整收益（42个收盘），窗口中缺失即缺失。
    hypothesis: 尾部冲击后次日方向确认频率高，表示极端日方向延续。
    family: tail_event_response
    nearest_previous: body_transition_asymmetry / gap_shock_body_reversal
    distinction: 前者看一般实体符号转移，后者看缺口冲击实体反转；本候选只在按历史阈值预定义的收益尾事件上计算次日方向命中率。
