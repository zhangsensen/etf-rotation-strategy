mechanisms:
  l42_peer_liquidity_adjusted_return:
    direction: 1
    raw_formula: For each i,t, q_i,t=r_i,t/(1+|e_i,t|), with e_i,t=log(amount_i,t)-mean(previous
      20 log amounts); compute beta_20(q_i,t, m^-i_t), where m^-i is mean peer e;
      group fixed-member mean.
    hypothesis: Positive own return per unit own activity, when peers are active,
      suggests efficient selective repricing rather than requiring exceptional turnover.
    family: peer_activity_impact
    nearest_previous: market_residual_amount_beta_20; amount_innovation_return_beta_20
    distinction: Uses a bounded liquidity-adjusted return response conditional on
      contemporaneous leave-one-out peer activity, not a beta of amount on return.
  l42_peer_flow_impact_spread:
    direction: 1
    raw_formula: beta_20(r_i,t,m^-i_t) - beta_20(r_i,t,abs(m^-i_t)); both OLS slopes
      include intercept and use population moments (ddof=0); require 20 complete pairs
      and nonzero predictor variance. Group fixed-member mean.
    hypothesis: A larger signed-flow response than absolute-flow response indicates
      peer activity carries directional information beyond activity magnitude; direction
      +1 is frozen.
    family: peer_activity_impact
    nearest_previous: downside_price_impact_share; market_residual_amount_beta_20
    distinction: Explicit signed-minus-absolute peer activity slope contrast; direction
      agrees with the stated informed-directional-activity hypothesis.
  l42_amount_neutral_peer_response:
    direction: 1
    raw_formula: On complete 20-pair windows, OLS with intercept of member return
      on peer activity mean and own activity innovation; return the peer-activity
      slope. Population covariance moments (ddof=0); singular or near-singular design
      when determinant <= 1e-12 * Var(peer)*Var(own) is NaN. Group fixed-member mean.
    hypothesis: Peer activity that predicts return beyond own activity is evidence
      of cross-ETF transmission, not simply own turnover-price coupling.
    family: peer_activity_impact
    nearest_previous: peer_lag_return_beta_20; amount_innovation_return_beta_20
    distinction: Partial peer-amount slope conditions on own amount innovation; prior
      peer variable definitions do not control own flow.
  l42_peer_flow_impact_instability:
    direction: -1
    raw_formula: Over the trailing 40 complete pairs, calculate the population standard
      deviation across four consecutive non-overlap 10-pair beta(r_i,m^-i); group
      fixed-member mean; require all 40 pairs.
    hypothesis: An unstable response to peer flow suggests unreliable liquidity transmission;
      lower instability is expected to accompany durable relative demand.
    family: peer_activity_impact
    nearest_previous: market_residual_amount_beta_20; amount_shock_*
    distinction: Measures time variation of a peer-flow response slope in prespecified
      disjoint blocks, not shock magnitude or a window-only variant of amount expansion.
