mechanisms:
  vix_risk_same_day_response:
    direction: 1
    family: external_us_option_implied_risk_transmission
    hypothesis: A prior-US-close increase in option-implied risk expectations may cause persistent cross-market de-risking. ETF groups with a more positive historical response to a VIX shock may retain relative strength during H5; negative shocks reverse the ranking.
    raw_formula: On China D, x_D=log(VIX_u/VIX_previous_valid_US) for the latest valid US observation u strictly before D and at most five calendar days old. score_i=beta0_i,D-1*x_D, where beta0=cov(r_i,t,x_t)/var(x_t), ddof=0, on exactly 60 complete China-session pairs t=D-60..D-1. D ETF return and x_D do not enter beta.
  vix_risk_delayed_response:
    direction: 1
    family: external_us_option_implied_risk_transmission
    hypothesis: Hedging and risk-budget adjustments to an overseas implied-volatility shock may reach ETF groups with a one-China-session lag, then continue into H5.
    raw_formula: score_i=beta1_i,D-1*x_D; beta1=cov(r_i,t,x_(t-1))/var(x_(t-1)), ddof=0, on exactly 60 complete ETF-return pairs t=D-60..D-1 with prior-China-session aligned VIX shocks. D inputs do not enter beta.
  vix_risk_sign_asymmetry:
    direction: 1
    family: external_us_option_implied_risk_transmission
    hypothesis: Rising risk expectations may transmit through forced risk reduction faster than falling risk expectations transmit through rebuilding positions; each signed response may continue over H5.
    raw_formula: On exactly 60 complete pairs t=D-60..D-1 estimate beta_plus using x_t>0 and beta_minus using x_t<0, requiring at least 10 historical dates in each branch; ddof=0. score_i=beta_plus_i,D-1*x_D if x_D>0, or beta_minus_i,D-1*x_D if x_D<0; missing if x_D=0. D inputs do not enter beta.
notes:
  population: fixed 14 candidate ETFs and eight economic groups; VIX is auxiliary information only
  external_source: CBOE Volatility Index daily close through FRED VIXCLS, https://fred.stlouisfed.org/series/VIXCLS; methodology https://cdn.cboe.com/api/global/us_indices/governance/VIX_Methodology.pdf
  foreign_timing: Compute log change on consecutive valid VIX US observations. For each China D use the most recent valid US observation date strictly earlier than D and no more than five calendar days old; same-date US close is never available at China D close.
  source_vintage: FRED historical snapshot trimmed to 2026-03-24, SHA256 identified; not a point-in-time archive, so revisions remain a limitation. CBOE regular-session VIX disseminates through 16:15 ET, well after the same China calendar day's close.
  sign_story: A higher VIX reflects greater US option-implied near-term volatility expectations, not realized ETF volatility or net fund flow. Positive historical beta to its signed shock may proxy defensive group strength after a risk-off impulse; negative historical beta may proxy risk-sensitive weakness. The testable plus direction assumes cross-market risk-budget adjustment persists from D+2 to D+7, not that every VIX move must predict returns.
  overlap_risk: Domestic ETF realized-volatility and price-shock families, old us_lagged_transmission_60, and R01 SOX source are explicit no-label redundancy references. Distinct source does not imply distinct eight-group score.
  historical_status: PREVIOUSLY_SEEN_2025_PLUS_NOT_OOS
  decision_boundary: Proposed draft only. Master approval required before registration or any new H5 label read; zero evidence is retained.
