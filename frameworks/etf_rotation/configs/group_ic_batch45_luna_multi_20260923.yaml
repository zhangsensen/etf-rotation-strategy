mechanisms:
  l45_peer_flow_lagged_correlation:
    direction: 1
    raw_formula: Pearson correlation (ddof=0) over 20 complete pairs between own activity
      innovation e_i,t and one-day-lagged leave-one-out average peer activity innovation
      m^-i_(t-1); zero variance => NaN; group fixed-member mean.
    hypothesis: A member’s current trading activity following peer activity from the
      prior session indicates diffusion of activity after peers were active; activity
      innovation is not signed inflow/outflow.
    family: activity_coherence
    nearest_previous: peer_lag_return_beta_20; lagged_volume_return_corr_20
    distinction: Uses lagged peer activity predicting own activity, not peer return
      predicting own return or own lagged volume change predicting own return.
  l45_peer_flow_directional_consensus:
    direction: 1
    raw_formula: For each member/date, take absolute mean sign(activity innovation)
      across the other 13 fixed ETFs; zero innovation contributes zero sign; average
      over 20 complete dates; group fixed-member mean. This is a peer consensus score,
      not amount direction or cash flow.
    hypothesis: Absolute leave-one-out peer sign consensus describes the contemporaneous
      fixed-pool activity regime around each member; +1 predicts that stronger peer
      agreement supports member-group relative demand. Note the member exclusion makes
      the feature related to own sign relative to the pool.
    family: activity_coherence
    nearest_previous: amount_innovation_sign_entropy_20; breadth
    distinction: Nonlinear absolute peer sign consensus differs from own temporal
      amount-sign entropy; leave-one-out algebra means the component is pool consensus
      with own sign excluded, which is disclosed rather than treated as a wholly independent
      breadth measure.
  l45_peer_flow_shock_catchup:
    direction: 1
    raw_formula: For each i,t calculate e_i,t - mean_{j!=i}(e_j,t-1); take mean over
      previous 20 dates and group fixed-member mean.
    hypothesis: A member’s current trading-activity innovation exceeding yesterday’s
      peer average indicates diffusion of activity after peers were active; +1 predicts
      relative demand persistence. Activity innovation is not signed inflow/outflow.
    family: activity_coherence
    nearest_previous: amount_innovation_return_beta_20; peer_lag_return_beta_20
    distinction: Uses lagged peer amount shock followed by current own amount shock;
      neither price return nor same-series flow-return relation is in the formula.
  l45_peer_flow_shock_divergence:
    direction: -1
    raw_formula: For each i,t calculate (e_i,t-mean_{j!=i}(e_j,t))^2; score mean over
      20 dates; group fixed-member mean.
    hypothesis: Persistent own-versus-peer trading-activity divergence indicates an
      isolated activity move with less fixed-pool confirmation; -1 rewards lower divergence.
      Activity innovation is not signed inflow/outflow.
    family: activity_coherence
    nearest_previous: amount_concentration_20; amount_innovation_abs_change_20
    distinction: Cross-sectional squared deviation from same-day leave-one-out peer
      flow, not temporal own-flow concentration or absolute flow changes.
