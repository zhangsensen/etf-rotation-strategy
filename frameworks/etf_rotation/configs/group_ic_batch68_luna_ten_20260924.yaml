mechanisms:
  l68_down_market_relative_win_rate:
    direction: 1
    raw_formula: m_{−i,t}=mean_{j≠i}(r_j,t); over the 20 consecutive trading dates
      ending at D, sum(1[m_{−i,t}<0 and r_i,t>m_{−i,t}])/count(m_{−i,t}<0); NaN if
      no qualifying date.
    hypothesis: Winning more often while the peer set falls indicates defensive demand
      capture.
    family: down_peer_state_capture
    nearest_previous: downside_beta / downside_semivariance (response magnitude or
      variance, not conditional hit probability).
    distinction: Condition is peer-set negative return; target is probability of outperformance,
      not slope. Each factor uses a fixed contiguous 20-row trailing window; missing
      required inputs invalidate that window rather than compressing dates.
  l68_down_market_relative_mean:
    direction: 1
    raw_formula: Over latest 20 dates, sum(e_i,t·1[m_{−i,t}<0])/count(m_{−i,t}<0),
      e_i,t=r_i,t−m_{−i,t}; NaN if no qualifying date.
    hypothesis: Average excess return during peer-set drawdown measures downside capture
      magnitude.
    family: down_peer_state_capture
    nearest_previous: market_residual_downside_mean (conditions on the member residual
      sign rather than peer-set market state).
    distinction: A peer-state conditional expectation rather than unconditional downside-residual
      magnitude. Each factor uses a fixed contiguous 20-row trailing window; missing
      required inputs invalidate that window rather than compressing dates.
  l68_down_market_rank:
    direction: 1
    raw_formula: R_i,t=average cross-sectional rank percentile of r_i,t among 14;
      factor=mean(R_i,t over the 20 consecutive trading dates ending at D with m_{−i,t}<0);
      NaN if none.
    hypothesis: Relative ordering during broad peer weakness measures defensive leadership
      rank.
    family: down_peer_state_capture
    nearest_previous: down_market_relative_win_rate and downside_beta.
    distinction: Uses ordinal rank on peer-down dates, separate from binary win probability
      and return-unit slope. Each factor uses a fixed contiguous 20-row trailing window;
      missing required inputs invalidate that window rather than compressing dates.
