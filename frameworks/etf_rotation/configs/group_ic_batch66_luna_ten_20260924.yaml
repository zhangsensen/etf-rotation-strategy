mechanisms:
  l66_relative_rank_persistence:
    direction: 1
    raw_formula: R_i,t=average_rank_14(close_i,t/close_i,t-1−1)/14; factor=PearsonCorr(R_i,t,R_i,t-1)
      over the 20 20 consecutive valid daily transitions.
    hypothesis: Persistent relative leadership may indicate durable information diffusion.
    family: cross_sectional_rank_dynamics
    nearest_previous: peer_flow_rank_persistence (amount rank, not return rank); rank_persistence_60
      (mean rank level, not lag correlation; prior definition was dropped after high
      redundancy with vol_scaled_momentum).
    distinction: This is a temporal autocorrelation of daily cross-sectional ranks,
      not a trailing average rank or raw-return momentum. Each factor uses a fixed
      contiguous 20-row trailing window; missing required inputs invalidate that window
      rather than compressing dates.
  l66_rank_upgrade_rate:
    direction: 1
    raw_formula: R_i,t as above; factor=mean_{20 transitions}(1[R_i,t>R_i,t-1]).
    hypothesis: Frequent movement up the fixed-pool return ordering marks improving
      leadership breadth.
    family: cross_sectional_rank_dynamics
    nearest_previous: relative_rank_persistence; group_return_autocorrelation_relative_60
      (within-group return time series, not changes in member cross-sectional ranks).
    distinction: A directional transition probability, not rank-level mean or rank
      autocorrelation. Each factor uses a fixed contiguous 20-row trailing window;
      missing required inputs invalidate that window rather than compressing dates.
  l66_rank_mobility:
    direction: -1
    raw_formula: R_i,t as above; factor=mean_{20 transitions}(|R_i,t−R_i,t-1|).
    hypothesis: Large rank jumps indicate unstable leadership and weak persistence
      of relative demand.
    family: cross_sectional_rank_dynamics
    nearest_previous: relative_rank_persistence / rank_upgrade_rate.
    distinction: Absolute step size measures rank instability regardless of whether
      rank moves up or down; no window-only variation. Each factor uses a fixed contiguous
      20-row trailing window; missing required inputs invalidate that window rather
      than compressing dates.
