mechanisms:
  cnh_same_day_response:
    direction: 1
    family: external_offshore_cny_fx_transmission
    hypothesis: A rise in offshore USDCNH reflects renminbi depreciation pressure and cross-border risk repricing. ETF groups with a more positive historical contemporaneous response to that signed FX shock may continue to reprice over H5; renminbi appreciation reverses the predicted ranking.
    raw_formula: On China D, x_D=log(mid_u/mid_prev) for the latest FXCM USDCNH observation u strictly before D and at most five calendar days old, mid=(bid_close+ask_close)/2. score_i=beta0_i,D-1*x_D, where beta0=cov(r_i,t,x_t)/var(x_t), ddof=0, on exactly 60 complete China-session pairs t=D-60..D-1. D ETF return and x_D do not enter beta.
  cnh_delayed_response:
    direction: 1
    family: external_offshore_cny_fx_transmission
    hypothesis: FX-driven portfolio reallocation may reach domestic ETF groups with a one-China-session lag, then continue into H5.
    raw_formula: score_i=beta1_i,D-1*x_D; beta1=cov(r_i,t,x_(t-1))/var(x_(t-1)), ddof=0, on exactly 60 complete ETF-return pairs t=D-60..D-1 with prior-China-session aligned USDCNH shocks. D inputs do not enter beta.
  cnh_sign_asymmetry:
    direction: 1
    family: external_offshore_cny_fx_transmission
    hypothesis: Depreciation shocks driven by outflow pressure may transmit differently from appreciation shocks driven by inflow return; each signed response may continue over H5.
    raw_formula: On exactly 60 complete pairs t=D-60..D-1 estimate beta_plus using x_t>0 and beta_minus using x_t<0, requiring at least 10 historical dates in each branch; ddof=0. score_i=beta_plus_i,D-1*x_D if x_D>0, or beta_minus_i,D-1*x_D if x_D<0; missing if x_D=0. D inputs do not enter beta.
notes:
  population: fixed 14 candidate ETFs and eight economic groups; offshore USDCNH is auxiliary information only
  external_source: FXCM offshore USDCNH daily bid/ask closes from the local long-history proxy library (SHA256-pinned, trimmed to the 2026-03-24 cold cutoff); near-24h market, daily bar closes near 17:00 New York time; 3757 observations from 2014-01-02
  foreign_timing: Compute log mid change on consecutive valid FXCM observation dates. For each China D use the most recent observation date strictly earlier than D and no more than five calendar days old; the same-calendar-date foreign close is never assumed known at China D close.
  source_vintage: Local historical proxy snapshot, not a point-in-time archive; FXCM quotes can be revised or backfilled. This is seen-history discovery, not PIT confirmation.
  sign_story: A positive x_D means the offshore renminbi depreciated on the latest known foreign session. Positive historical beta times the signed shock ranks groups that historically strengthened alongside CNH depreciation (cross-border USD-linked exposure, hard assets) higher; appreciation reverses the ranking. One-sided continuation over D+2..D+7 is a falsifiable hypothesis, not an observed fact.
  overlap_risk: Old usd_beta_60 is the explicit near-neighbor; R01-R06 transmission families and us_lagged_transmission_60 are additional references. Distinct source does not imply distinct eight-group score.
  historical_status: PREVIOUSLY_SEEN_2025_PLUS_NOT_OOS
  decision_boundary: Proposed draft only. Master approval required before registration or any new H5 label read; zero evidence is retained.
