# within-window residual. Independently built from these literature
# definitions; pi workspace code not read.
atoms:
  - {name: S28_PRICE_POSITION_20, family: pi_repl_s28}
  - {name: S28_VOV_HAR_RESID_20, family: pi_repl_s28}
grammar: {operators: [atomic, rank_spread], pair_policy: cross_family_only, max_atoms: 2}
