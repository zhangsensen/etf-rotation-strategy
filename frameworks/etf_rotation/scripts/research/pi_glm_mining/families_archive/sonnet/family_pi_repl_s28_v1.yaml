# S28 stage (round_618): the only 2 atoms in the S28 pair list with no
# prior independent implementation on this line. S28_PRICE_POSITION_20:
# Lane (1984) Stochastic %K-style price-range position, 20d high/low.
# S28_VOV_HAR_RESID_20: Corsi (2009) HAR-RV residual (volatility-of-
# volatility surprise), 60d rolling regression of daily RV (from 1m
