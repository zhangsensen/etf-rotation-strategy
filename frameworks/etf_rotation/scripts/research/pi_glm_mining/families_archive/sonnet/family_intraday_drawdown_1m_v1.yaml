domain: etf_rotation
grammar_version: etf_family_intraday_drawdown_1m_v1
factor_source: intraday_drawdown_1m
frequency: 1m
# Literature provenance (directive: no citation, no atom):
# INTRADAY_MAXDD_20: Magdon-Ismail & Atiya (2004) maximum drawdown,
#   applied to the 1m intraday price path, 20d mean.
# INTRADAY_MAXRUNUP_20: symmetric maximum intraday runup (peak-to-trough
#   in reverse), 20d mean.
# DD_RUNUP_ASYM_20: INTRADAY_MAXDD_20 - INTRADAY_MAXRUNUP_20 (path
#   asymmetry between down-moves and up-moves within the day).
# UNDERWATER_FRAC_20: Grossman & Zhou (1993) underwater-time framing,
#   fraction of 1m bars trading below the running intraday peak, 20d mean.
# INTRADAY_CDAR_20: Chekhlov-Uryasev-Zabarankin (2005) Conditional
#   Drawdown-at-Risk, mean drawdown over the worst 20% of 1m bars, 20d mean.
# DD_TROUGH_TIMING_20: intraday position (0=open,1=close) where the day's
#   deepest drawdown occurs, 20d mean.
# *_CHG_20: 20-day change of the corresponding level atom.
atoms:
  - {name: INTRADAY_MAXDD_20, family: intraday_drawdown_1m}
  - {name: INTRADAY_MAXRUNUP_20, family: intraday_drawdown_1m}
  - {name: DD_RUNUP_ASYM_20, family: intraday_drawdown_1m}
  - {name: UNDERWATER_FRAC_20, family: intraday_drawdown_1m}
  - {name: INTRADAY_CDAR_20, family: intraday_drawdown_1m}
  - {name: DD_TROUGH_TIMING_20, family: intraday_drawdown_1m}
  - {name: INTRADAY_MAXDD_CHG_20, family: intraday_drawdown_1m}
  - {name: UNDERWATER_FRAC_CHG_20, family: intraday_drawdown_1m}
grammar: {operators: [atomic], pair_policy: cross_family_only, max_atoms: 1}
